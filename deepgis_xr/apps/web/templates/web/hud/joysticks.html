    <!-- Virtual joysticks (hud/joysticks.js), QGC Mode 2: left stick climbs and
         yaws, right stick moves over the ground. Shown from the Flight panel or J. -->
    <div id="leftJoystick" class="joystick-container">
        <div class="joystick-base">
            <div class="joystick-markers">
                <div class="joystick-marker north">▲</div>
                <div class="joystick-marker south">▼</div>
                <div class="joystick-marker east">↻</div>
                <div class="joystick-marker west">↺</div>
            </div>
            <div class="joystick-value" id="leftJoystickValue">0,0</div>
            <div class="joystick-stick" id="leftJoystickStick"></div>
            <div class="joystick-label">Climb / Yaw</div>
        </div>
    </div>

    <div id="rightJoystick" class="joystick-container">
        <div class="joystick-base">
            <div class="joystick-markers">
                <div class="joystick-marker north">▲</div>
                <div class="joystick-marker south">▼</div>
                <div class="joystick-marker east">▶</div>
                <div class="joystick-marker west">◀</div>
            </div>
            <div class="joystick-value" id="rightJoystickValue">0,0</div>
            <div class="joystick-stick" id="rightJoystickStick"></div>
            <div class="joystick-label">Move</div>
        </div>
    </div>
