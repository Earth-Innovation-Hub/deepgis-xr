    <!-- VR Panel -->
    <div class="hud-panel" id="vrPanel">
        <div class="hud-panel-header">
            <div class="hud-panel-title"><i class="fas fa-vr-cardboard" style="color: #8b5cf6;"></i> WebXR / VR</div>
            <button class="hud-panel-close" onclick="closeHudPanel('vrPanel')"><i class="fas fa-times"></i></button>
        </div>
        <div class="btn-group-vertical w-100 mb-3" role="group">
            <button class="btn btn-primary btn-sm mb-1" id="checkVRSupport">
                <i class="fas fa-search me-2"></i>Check VR Support
            </button>
            <button class="btn btn-success btn-sm mb-1" id="enterVR" disabled>
                <i class="fas fa-vr-cardboard me-2"></i>Enter VR
            </button>
            <button class="btn btn-danger btn-sm" id="exitVR" disabled>
                <i class="fas fa-times me-2"></i>Exit VR
            </button>
        </div>
        <div id="vrStatus" style="color: #94a3b8; font-size: 0.8rem; padding: 8px; background: rgba(0,0,0,0.3); border-radius: 4px;">
            VR Status: Not checked
        </div>
    </div>
