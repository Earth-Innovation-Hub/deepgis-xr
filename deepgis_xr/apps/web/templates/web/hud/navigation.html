    <!-- Navigation Widget Group - Contains heading dial and attitude indicator -->
    <div class="navigation-widget-group" id="navigationWidgetGroup">
        <div class="widget-title">Navigation</div>
        
        <!-- Heading Dial Widget -->
        <div class="heading-dial" id="headingDial">
            <div class="heading-dial-container">
                <div class="heading-dial-face" id="headingDialFace">
                    <div class="heading-dial-markings" id="headingDialMarkings">
                        <!-- Markings will be generated by JavaScript -->
                    </div>
                    <div class="heading-dial-labels" id="headingDialLabels">
                        <!-- Labels will be positioned by JavaScript -->
                    </div>
                </div>
                <div class="heading-dial-needle" id="headingDialNeedle"></div>
                <div class="heading-dial-center"></div>
            </div>
            <div class="heading-dial-readout" id="headingDialReadout">000°T</div>
        </div>

        <!-- Attitude Indicator -->
        <div class="attitude-indicator" id="attitudeIndicator">
            <div class="attitude-horizon" id="attitudeHorizon">
                <div class="attitude-sky"></div>
                <div class="attitude-ground"></div>
                <div class="attitude-horizon-line"></div>
            </div>
            <div class="attitude-aircraft"></div>
            <div class="attitude-center-dot"></div>
        </div>
        
        <!-- Attitude Readout -->
        <div class="attitude-readout" id="attitudeReadout">000°P 000°R</div>
        
        <!-- Altitude Meter -->
        <div class="altitude-meter" id="altitudeMeter">
            <div class="altitude-meter-container">
                <div class="altitude-tape" id="altitudeTape">
                    <!-- Altitude values will be generated by JavaScript -->
                </div>
                <div class="altitude-pointer"></div>
            </div>
            <div class="altitude-readout" id="altitudeReadout">
                <div class="altitude-value" id="altitudeValue">00000</div>
                <div class="altitude-unit">FEET</div>
            </div>
        </div>
    </div>
