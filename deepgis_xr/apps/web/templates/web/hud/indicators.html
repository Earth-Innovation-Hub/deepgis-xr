    <!-- Main Heading -->
    <div class="main-heading">{% if hud_body == "earth" %}DeepGIS Search{% else %}DeepGIS <span data-body-name>{{ hud_body|title }}</span> Viewer{% endif %}</div>

    <!-- Hidden sink for main.js / mission-planner status messages -->
    <div class="status-indicator" id="statusIndicator" hidden>Initializing Cesium...</div>

    <!-- FPS pill (main.js startPerformanceMonitoring); Cesium's own overlay is off -->
    <div class="performance-indicator" id="performanceIndicator">
        FPS: --
    </div>

    {% if hud_body == "earth" %}
    <!-- Aircraft Count Indicator (Main Viewport) -->
    <div class="aircraft-count-indicator" id="aircraftCountIndicator">
        <i class="fas fa-plane icon"></i>
        <span class="count" id="aircraftCountMain">0</span>
        <span class="label">Aircraft in View</span>
    </div>
    {% endif %}
