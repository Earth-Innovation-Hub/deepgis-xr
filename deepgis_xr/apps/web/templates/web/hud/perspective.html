    <!-- Perspective Views Widget - HUD Style -->
    <div class="perspective-views-widget" id="perspectiveViewsWidget">
        <div class="widget-title">Perspective Views</div>
        <div class="perspective-compass-grid">
            <button class="perspective-btn-hud" id="viewNorth" title="North">
                <i class="fas fa-arrow-up"></i><br><small>N</small>
            </button>
            <button class="perspective-btn-hud" id="viewWest" title="West">
                <i class="fas fa-arrow-left"></i><br><small>W</small>
            </button>
            <button class="perspective-btn-hud" id="viewEast" title="East">
                <i class="fas fa-arrow-right"></i><br><small>E</small>
            </button>
            <button class="perspective-btn-hud" id="viewSouth" title="South">
                <i class="fas fa-arrow-down"></i><br><small>S</small>
            </button>
        </div>
    </div>
