{% load hud_tags %}
    <!-- Layers Panel: the AI pilot's data layers as toggles (hud/layers-panel.js, catalog
         from views/pilot.py layer_catalog) and, on Earth, the Site -> Dataset -> Timestep ->
         Product tile catalog. The mount node #tileCatalogMount is populated by main.js once
         the tile-catalog endpoint (/api/v1/tile-catalog/) responds. -->
    <div class="hud-panel" id="layersPanel">
        <div class="hud-panel-header">
            <div class="hud-panel-title"><i class="fas fa-layer-group"></i> Layers</div>
            <button class="hud-panel-close" onclick="closeHudPanel('layersPanel')"><i class="fas fa-times"></i></button>
        </div>
        {% hud_layer_catalog hud_body %}
        <div id="dataLayersMount" data-signed-in="{{ user.is_authenticated|yesno:'1,0' }}"></div>
        {% if hud_body == "earth" %}
        <div class="dl-heading dl-catalog-heading">Tile catalog</div>
        <div id="tileCatalogMount">
            <small style="color: #94a3b8;">Loading catalog&hellip;</small>
        </div>
        {% endif %}
    </div>
