<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeepGIS Search</title>
    
    <!-- CSRF Token for API requests -->
    {% csrf_token %}
    
    <!-- Cesium Dependencies -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    
    <!-- Additional Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" crossorigin="anonymous"></script>
    
    <!-- QR Code Generator -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js" crossorigin="anonymous"></script>

    <!-- Preload disabled due to CORS issues - using Ion Asset ID instead -->
    <!-- <link rel="preload" href="https://deepgis.org/static/deepgis/models/gltf/navagunjara-reborn-digital-twin-propane-and-solar-v4.glb" as="fetch" crossorigin="anonymous"> -->
    <link rel="dns-prefetch" href="https://cesium.com">
    
    <!-- Suppress Cesium source map 404 errors -->
    <!-- Set Cesium Ion access token from server configuration -->
    <script>
        window.CESIUM_ION_TOKEN = '{{ cesium_ion_token }}';
        Cesium.Ion.defaultAccessToken = window.CESIUM_ION_TOKEN;
    </script>
    
    <!-- Application Styles -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'web/styles/main.css' %}">
    <link rel="stylesheet" href="{% static 'web/styles/tile-catalog.css' %}">
    
    <!-- HUD Style Layout -->
    <link rel="stylesheet" href="{% static 'web/styles/hud.css' %}?v=20261021">
</head>

<body>
    <button class="mobile-toggle" id="sidebarToggle">
        <i class="fa fa-bars"></i>
    </button>

    <div id="wrapper">
        <div id="sidebar-wrapper">
            <div class="sidebar-content">
                <div class="sidebar-header">
                    <h5><i class="fas fa-search"></i> DeepGIS Search</h5>
                    <small>Hybrid 2D/3D Viewer</small>
                </div>
                
                <div class="layer-controls">
                    <!-- Date Selection - HIDDEN (removed as not needed) -->
                    <div class="layer-group" style="display: none;">
                        <div class="layer-group-title">
                            <i class="fas fa-calendar-alt"></i> Available Dates
                        </div>
                        <div class="form-group mb-3">
                            <select class="form-select" id="dateSelect">
                                <!-- Will be populated dynamically -->
                            </select>
                        </div>
                    </div>

                    <!-- View & Display moved to HUD bottom toolbar -->

                    <!-- WebXR / VR moved to HUD bottom toolbar -->

                    <!-- AI Analysis moved to HUD bottom toolbar -->

                    <!-- Measurement Tools moved to HUD bottom toolbar -->

                    <!-- Mission Planning moved to HUD bottom toolbar -->
                </div>
            </div>
        </div>
    </div>

    <div id="cesiumContainer"></div>

    {% include "web/hud/hud.html" with hud_body="earth" %}
    <!-- Application JavaScript (built by Vite) -->
    {% load static %}
    <script type="module" src="{% static 'web/js/main.js' %}"></script>
    
    <!-- GPS Telemetry Path Loader -->
    <!-- Note: GPS Telemetry is now integrated into Mission Planner panel -->
    <!-- It will be initialized automatically when Mission Planner is created -->
    <script src="{% static 'web/js/gps-telemetry.js' %}"></script>
    
    <!-- World Sampler UI -->
    <script src="{% static 'web/js/world-sampler-ui.js' %}"></script>
    <!-- Urban Spectral (OSM building graph + kernelcal diagnostics) -->
    <script src="{% static 'web/js/urban-spectral-ui.js' %}"></script>
    <script src="{% static 'web/js/mission-planner.js' %}"></script>
    <script src="{% static 'web/js/widgets/altimeter.js' %}?v=20261021"></script>
    <script>
        // HUD Panel Management
        (function() {
            let activePanel = null;
            
            function closeHudPanel(panelId) {
                const panel = document.getElementById(panelId);
                if (panel) {
                    panel.classList.remove('visible');
                    const btn = document.querySelector(`[data-panel="${panelId}"]`);
                    if (btn) btn.classList.remove('active');
                    if (activePanel === panelId) activePanel = null;
                }
            }
            window.closeHudPanel = closeHudPanel; // Make globally accessible
            
            function toggleHudPanel(panelId) {
                const panel = document.getElementById(panelId);
                const btn = document.querySelector(`[data-panel="${panelId}"]`);
                
                // Close any open panel
                if (activePanel && activePanel !== panelId) {
                    closeHudPanel(activePanel);
                }
                
                if (panel.classList.contains('visible')) {
                    panel.classList.remove('visible');
                    if (btn) btn.classList.remove('active');
                    activePanel = null;
                } else {
                    panel.classList.add('visible');
                    if (btn) btn.classList.add('active');
                    activePanel = panelId;
                }
            }
            
            function initHUD() {
                // Setup toolbar button clicks
                document.querySelectorAll('.hud-btn[data-panel]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const panelId = btn.getAttribute('data-panel');
                        toggleHudPanel(panelId);
                    });
                });
                
                // Quick view buttons
                document.getElementById('quickView2D')?.addEventListener('click', () => {
                    document.getElementById('view2D')?.click();
                });
                document.getElementById('quickView3D')?.addEventListener('click', () => {
                    document.getElementById('view3D')?.click();
                });
                document.getElementById('quickHome')?.addEventListener('click', () => {
                    document.getElementById('homeView')?.click();
                });
                
                // Close panel when clicking outside
                document.addEventListener('click', (e) => {
                    if (activePanel) {
                        const panel = document.getElementById(activePanel);
                        const toolbar = document.getElementById('hudToolbar');
                        if (panel && !panel.contains(e.target) && !toolbar.contains(e.target)) {
                            closeHudPanel(activePanel);
                        }
                    }
                
                    // Close keyboard shortcuts legend when clicking outside
                    const legend = document.getElementById('keyboardShortcutsLegend');
                    if (legend && legend.classList.contains('visible') && !legend.contains(e.target)) {
                        legend.classList.remove('visible');
                    }
                });
                
                // Keyboard shortcuts handler
                document.addEventListener('keydown', (e) => {
                    // Ignore if typing in input fields
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
                        return;
                    }
                    
                    // H key: Toggle keyboard shortcuts legend
                    if (e.key === 'h' || e.key === 'H') {
                        e.preventDefault();
                        const legend = document.getElementById('keyboardShortcutsLegend');
                        if (legend) {
                            legend.classList.toggle('visible');
                        }
                        return;
                    }
                    
                    // V key: Toggle view mode (2D/3D)
                    if (e.key === 'v' || e.key === 'V') {
                        e.preventDefault();
                        const viewer = window.AppState?.viewer || window.viewer;
                        if (viewer) {
                            const currentMode = viewer.scene.mode;
                            if (currentMode === Cesium.SceneMode.SCENE3D) {
                                // Switch to 2D
                                const btn2D = document.getElementById('view2D');
                                if (btn2D) btn2D.click();
                            } else {
                                // Switch to 3D
                                const btn3D = document.getElementById('view3D');
                                if (btn3D) btn3D.click();
                            }
                        }
                        return;
                    }
                    
                    // Arrow keys: Perspective views
                    if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        const btnNorth = document.getElementById('viewNorth');
                        if (btnNorth) btnNorth.click();
                        return;
                    }
                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        const btnSouth = document.getElementById('viewSouth');
                        if (btnSouth) btnSouth.click();
                        return;
                    }
                    if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        const btnWest = document.getElementById('viewWest');
                        if (btnWest) btnWest.click();
                        return;
                    }
                    if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        const btnEast = document.getElementById('viewEast');
                        if (btnEast) btnEast.click();
                        return;
                    }
                    
                    // F key: Toggle full screen
                    if (e.key === 'f' || e.key === 'F') {
                        e.preventDefault();
                        if (!document.fullscreenElement) {
                            document.documentElement.requestFullscreen().catch(err => {
                                console.warn('Error attempting to enable fullscreen:', err);
                            });
                        } else {
                            document.exitFullscreen();
                        }
                        return;
                    }
                    
                    // B key: Toggle 3D Buildings
                    if (e.key === 'b' || e.key === 'B') {
                        e.preventDefault();
                        const buildingsToggle = document.getElementById('buildingsToggle');
                        if (buildingsToggle) {
                            buildingsToggle.checked = !buildingsToggle.checked;
                            buildingsToggle.dispatchEvent(new Event('change'));
                        }
                        return;
                    }
                    
                    // W key: Toggle wireframe/textured mode
                    if (e.key === 'w' || e.key === 'W') {
                        e.preventDefault();
                        const viewer = window.AppState?.viewer || window.viewer;
                        if (viewer && viewer.imageryLayers && viewer.scene) {
                            const globe = viewer.scene.globe;
                            const layers = viewer.imageryLayers;
                            
                            // Check if any layer is visible (default to true if no layers)
                            let hasVisibleLayers = true;
                            if (layers.length > 0) {
                                // Check if at least one layer is visible
                                hasVisibleLayers = false;
                                for (let i = 0; i < layers.length; i++) {
                                    if (layers.get(i).show) {
                                        hasVisibleLayers = true;
                                        break;
                                    }
                                }
                            }
                            
                            // Toggle all imagery layers
                            for (let i = 0; i < layers.length; i++) {
                                const layer = layers.get(i);
                                layer.show = !hasVisibleLayers;
                            }
                            
                            // Toggle wireframe mesh details
                            if (hasVisibleLayers) {
                                // Wireframe mode: Enable debug wireframe to show mesh details
                                try {
                                    // Access debug wireframe (private API, use with caution)
                                    if (globe._surface && globe._surface._tileProvider && globe._surface._tileProvider._debug) {
                                        globe._surface._tileProvider._debug.wireframe = true;
                                    }
                                    
                                    // Also set base color for better wireframe visibility
                                    globe.baseColor = Cesium.Color.fromCssColorString('#2d3748');
                                    
                                    // Disable lighting for clearer wireframe view
                                    globe.enableLighting = false;
                                    
                                    // Increase terrain exaggeration slightly to make mesh more visible
                                    if (globe.terrainExaggeration !== undefined) {
                                        globe.terrainExaggeration = Math.max(1.0, globe.terrainExaggeration || 1.0);
                                    }
                                    
                                    console.log('Wireframe mode: ON - Showing mesh details');
                                } catch (error) {
                                    console.warn('Could not enable wireframe debug mode:', error);
                                    // Fallback: just hide textures and set base color
                                    globe.baseColor = Cesium.Color.fromCssColorString('#4a5568');
                                    globe.enableLighting = false;
                                }
                            } else {
                                // Textured mode: Disable wireframe and restore settings
                                try {
                                    if (globe._surface && globe._surface._tileProvider && globe._surface._tileProvider._debug) {
                                        globe._surface._tileProvider._debug.wireframe = false;
                                    }
                                } catch (error) {
                                    // Ignore if debug property doesn't exist
                                }
                                
                                // Restore default settings
                                globe.baseColor = Cesium.Color.WHITE;
                                globe.enableLighting = true;
                                
                                console.log('Wireframe mode: OFF - Textured mode restored');
                            }
                        }
                        return;
                    }
                    
                    // T key: Hide/show all toolbars
                    if (e.key === 't' || e.key === 'T') {
                        e.preventDefault();
                        const toolbar = document.getElementById('hudToolbar');
                        const quickViews = document.querySelector('.hud-quick-views');
                        const cameraInfo = document.getElementById('cameraInfo');
                        const droneFlyWidget = document.getElementById('droneFlyWidget');
                        const droneOrbitWidget = document.getElementById('droneOrbitWidget');
                        const navWidget = document.getElementById('navigationWidgetGroup');
                        const perspectiveWidget = document.getElementById('perspectiveViewsWidget');
                        const performanceIndicator = document.getElementById('performanceIndicator');
                        const leftJoystick = document.getElementById('leftJoystick');
                        const rightJoystick = document.getElementById('rightJoystick');
                        const mainHeading = document.querySelector('.main-heading');
                        const sidebarHeader = document.querySelector('.sidebar-header');
                        const statusIndicator = document.getElementById('statusIndicator');
                        // Note: QR code overlay NOT included - stays visible in distraction-free mode
                        
                        // Toggle visibility of all toolbars/widgets (QR code stays visible)
                        const elements = [
                            toolbar, quickViews, cameraInfo, droneFlyWidget, droneOrbitWidget, 
                            navWidget, perspectiveWidget, performanceIndicator, leftJoystick, 
                            rightJoystick, mainHeading, sidebarHeader, statusIndicator
                        ].filter(el => el);
                        const isHidden = elements[0] && elements[0].style.display === 'none';
                        
                        elements.forEach(el => {
                            if (el) {
                                el.style.display = isHidden ? '' : 'none';
                            }
                        });
                        
                        console.log(`[HUD] Toolbars and widgets ${isHidden ? 'shown' : 'hidden'} (QR code remains visible)`);
                        return;
                    }
                    
                    // D key: Drone Fly Forward
                    if (e.key === 'd' || e.key === 'D') {
                        e.preventDefault();
                        const droneFlyBtn = document.getElementById('droneFlyBtn');
                        if (droneFlyBtn) {
                            droneFlyBtn.click();
                        }
                        return;
                    }
                    
                    // U key: Takeoff (Up)
                    if (e.key === 'u' || e.key === 'U') {
                        e.preventDefault();
                        const takeoffBtn = document.getElementById('droneTakeoffBtn');
                        if (takeoffBtn) {
                            takeoffBtn.click();
                        }
                        return;
                    }
                    
                    // L key: Land
                    if (e.key === 'l' || e.key === 'L') {
                        e.preventDefault();
                        const landBtn = document.getElementById('droneLandBtn');
                        if (landBtn) {
                            landBtn.click();
                        }
                        return;
                    }
                    
                    // O key: Start Orbit
                    if (e.key === 'o' || e.key === 'O') {
                        e.preventDefault();
                        const droneOrbitBtn = document.getElementById('droneOrbitBtn');
                        if (droneOrbitBtn) {
                            droneOrbitBtn.click();
                        }
                        return;
                    }
                    
                    // P key: Pause/Stop Orbit
                    if (e.key === 'p' || e.key === 'P') {
                        e.preventDefault();
                        const stopOrbitBtn = document.getElementById('stopOrbitBtn');
                        if (stopOrbitBtn && stopOrbitBtn.offsetParent !== null) {
                            // Only if stop button is visible (orbit is active)
                            stopOrbitBtn.click();
                        }
                        return;
                    }
                    
                    // J key: Toggle Joysticks
                    if (e.key === 'j' || e.key === 'J') {
                        e.preventDefault();
                        console.log('[Keyboard] J key pressed - toggling joysticks');
                        const joystickBtn = document.getElementById('hudJoystickBtn');
                        if (joystickBtn) {
                            console.log('[Keyboard] Joystick button found, clicking...');
                            joystickBtn.click();
                        } else {
                            console.error('[Keyboard] Joystick button not found!');
                        }
                        return;
                    }
                    
                    // Escape: Close active panel or keyboard shortcuts legend, or stop orbit
                    if (e.key === 'Escape') {
                        // First check if orbit is active and stop it
                        const stopOrbitBtn = document.getElementById('stopOrbitBtn');
                        const stopOrbitContainer = document.getElementById('stopOrbitContainer');
                        if (stopOrbitBtn && stopOrbitContainer && stopOrbitContainer.style.display !== 'none') {
                            stopOrbitBtn.click();
                            return;
                        }
                        
                        // Then close panels/legend
                        if (activePanel) {
                        closeHudPanel(activePanel);
                        }
                        const legend = document.getElementById('keyboardShortcutsLegend');
                        if (legend && legend.classList.contains('visible')) {
                            legend.classList.remove('visible');
                        }
                        return;
                    }
                });
                
                // Configuration for the six MaskRCNN sibling services running
                // alongside rocks (:5002) / house (:5003). Centralising this
                // table keeps the dropdown, the request builder and the
                // SceneGraph orchestrator in agreement on port + placeholder.
                // If you add another sibling service, extend this map plus
                // the matching elif branches in world-sampler-ui.js.
                window.MASKRCNN_SIBLING_CONFIG = window.MASKRCNN_SIBLING_CONFIG || {
                    'maskrcnn_hypolith': {
                        port: 5004,
                        placeholder: 'e.g. epoch_0011 (Gobabeb hypolith)',
                        description: 'Hypolith detection — Gobabeb/Namib Mask R-CNN (remote GPU at :5004). Single class "hypolith"; trained on Joshua Tree + Atacama + Namib desert ground-level imagery.'
                    },
                    'maskrcnn_litter': {
                        port: 5005,
                        placeholder: 'e.g. epoch_0008 (DeepGIS litter)',
                        description: 'Litter / debris detection — DeepGIS dynamics Mask R-CNN (remote GPU at :5005). Note: epoch_0008.param weights are byte-identical to NewLife — predictions may overlap until distinct checkpoints are recovered.'
                    },
                    'maskrcnn_roadkill': {
                        port: 5006,
                        placeholder: 'e.g. roadkill_epoch_0004_sarah',
                        description: 'Roadkill detection — Sarah preview Mask R-CNN (remote GPU at :5006). Single class "roadkill"; e0004 checkpoint, low training corpus — treat as a triage filter, not ground truth.'
                    },
                    'maskrcnn_newlife': {
                        port: 5007,
                        placeholder: 'e.g. epoch_0008 (DeepGIS newlife)',
                        description: 'New-life / organism detection — DeepGIS biology Mask R-CNN (remote GPU at :5007). Note: epoch_0008.param weights are byte-identical to Litter — predictions may overlap until distinct checkpoints are recovered.'
                    },
                    'maskrcnn_brent_moon_craters': {
                        port: 5008,
                        placeholder: 'e.g. download_openuas_us__epoch_0099 (Brent)',
                        description: 'Lunar crater detection — Brent\'s Mask R-CNN on LROC NAC tiles (remote GPU at :5008). Class "crater"; tuned for Moon imagery, not Mars.'
                    },
                    'maskrcnn_harish_moon_craters': {
                        port: 5009,
                        placeholder: 'e.g. download_openuas_us__epoch_0099 (Harish)',
                        description: 'Lunar crater detection — Harish\'s Mask R-CNN on LROC NAC tiles (remote GPU at :5009). Class "crater"; complementary checkpoint to Brent\'s for cross-checking.'
                    }
                };
                window.MASKRCNN_SIBLING_TYPES = window.MASKRCNN_SIBLING_TYPES ||
                    new Set(Object.keys(window.MASKRCNN_SIBLING_CONFIG));

                // Analysis type toggle (for AI panel)
                const analysisSelect = document.getElementById('analysisTypeSelect');
                if (analysisSelect) {
                    analysisSelect.addEventListener('change', (e) => {
                        const type = e.target.value;
                        document.getElementById('samOptions').style.display = type === 'sam' ? 'block' : 'none';
                        document.getElementById('yolov8Options').style.display = type === 'yolov8' ? 'block' : 'none';
                        document.getElementById('groundingDinoOptions').style.display = type === 'grounding_dino' ? 'block' : 'none';
                        document.getElementById('groundedSamOptions').style.display = type === 'grounded_sam' ? 'block' : 'none';
                        const maskrcnnRocksOpts = document.getElementById('maskrcnnRocksOptions');
                        if (maskrcnnRocksOpts) maskrcnnRocksOpts.style.display = type === 'maskrcnn_rocks' ? 'block' : 'none';
                        const maskrcnnHouseOpts = document.getElementById('maskrcnnHouseOptions');
                        if (maskrcnnHouseOpts) maskrcnnHouseOpts.style.display = type === 'maskrcnn_house' ? 'block' : 'none';
                        const maskrcnnSiblingOpts = document.getElementById('maskrcnnSiblingOptions');
                        const isSibling = window.MASKRCNN_SIBLING_TYPES.has(type);
                        if (maskrcnnSiblingOpts) maskrcnnSiblingOpts.style.display = isSibling ? 'block' : 'none';
                        if (isSibling) {
                            const cfg = window.MASKRCNN_SIBLING_CONFIG[type];
                            const modelIdInput = document.getElementById('maskrcnnSiblingModelId');
                            const registryHint = document.getElementById('maskrcnnSiblingRegistryHint');
                            if (modelIdInput) modelIdInput.placeholder = cfg.placeholder;
                            if (registryHint) {
                                registryHint.textContent = `Full registry: GET http://192.168.0.232:${cfg.port}/api/models`;
                            }
                        }
                        document.getElementById('zeroShotOptions').style.display = type === 'zero_shot' ? 'block' : 'none';
                        document.getElementById('mask2formerOptions').style.display = type === 'mask2former' ? 'block' : 'none';

                        const desc = document.getElementById('analysisDescription');
                        if (desc) {
                            const descriptions = {
                                'sam': 'Segments all visible regions using Segment Anything Model',
                                'yolov8': 'Ultra-fast detection with 80 COCO classes',
                                'grounding_dino': 'Text-based open-vocabulary object detection',
                                'grounded_sam': 'Detection + high-quality segmentation with text prompts',
                                'maskrcnn_rocks': 'Rock instance segmentation using Bishop/Jezero Mask R-CNN checkpoints (remote GPU at :5002)',
                                'maskrcnn_house': 'House / damage detection using the Tornado/Eureka Mask R-CNN ensemble (remote GPU at :5003). Trained on UAV-oblique tornado imagery — on overhead 3D-tile captures it tends to fire as a generic roof detector.',
                                'zero_shot': 'Detects common objects (person, car, etc.)',
                                'mask2former': 'State-of-the-art detection with 80 COCO categories',
                                'prithvi': 'Earth observation foundation model for satellite imagery'
                            };
                            const siblingCfg = window.MASKRCNN_SIBLING_CONFIG[type];
                            desc.textContent = (siblingCfg && siblingCfg.description) || descriptions[type] || '';
                        }
                    });
                }

                // MaskRCNN Rocks score-threshold slider
                const mrScore = document.getElementById('maskrcnnRocksScore');
                const mrScoreVal = document.getElementById('maskrcnnRocksScoreValue');
                if (mrScore && mrScoreVal) {
                    mrScore.addEventListener('input', (e) => {
                        mrScoreVal.textContent = (parseFloat(e.target.value) / 100).toFixed(2);
                    });
                }

                // MaskRCNN House score-threshold slider
                const mhScore = document.getElementById('maskrcnnHouseScore');
                const mhScoreVal = document.getElementById('maskrcnnHouseScoreValue');
                if (mhScore && mhScoreVal) {
                    mhScore.addEventListener('input', (e) => {
                        mhScoreVal.textContent = (parseFloat(e.target.value) / 100).toFixed(2);
                    });
                }

                // MaskRCNN Sibling services (hypolith / litter / roadkill /
                // newlife / brent + harish moon craters) share a single
                // score-threshold slider since the panel is reused.
                const msScore = document.getElementById('maskrcnnSiblingScore');
                const msScoreVal = document.getElementById('maskrcnnSiblingScoreValue');
                if (msScore && msScoreVal) {
                    msScore.addEventListener('input', (e) => {
                        msScoreVal.textContent = (parseFloat(e.target.value) / 100).toFixed(2);
                    });
                }
                
                // YOLOv8 confidence slider
                const yoloConf = document.getElementById('yolov8Confidence');
                const yoloConfVal = document.getElementById('yolov8ConfidenceValue');
                if (yoloConf && yoloConfVal) {
                    yoloConf.addEventListener('input', (e) => {
                        yoloConfVal.textContent = e.target.value + '%';
                    });
                }
                
                // Zero-shot confidence slider
                const zsConf = document.getElementById('zeroShotConfidence');
                const zsConfVal = document.getElementById('zeroShotConfidenceValue');
                if (zsConf && zsConfVal) {
                    zsConf.addEventListener('input', (e) => {
                        zsConfVal.textContent = (parseFloat(e.target.value) / 100).toFixed(2);
                    });
                }
                
                // Mask2former confidence slider
                const m2fConf = document.getElementById('mask2formerConfidence');
                const m2fConfVal = document.getElementById('mask2formerConfidenceValue');
                if (m2fConf && m2fConfVal) {
                    m2fConf.addEventListener('input', (e) => {
                        m2fConfVal.textContent = (parseFloat(e.target.value) / 100).toFixed(2);
                    });
                }
                
                // Grounding DINO threshold sliders
                const gdBox = document.getElementById('gdBoxThreshold');
                const gdBoxVal = document.getElementById('gdBoxThresholdValue');
                if (gdBox && gdBoxVal) {
                    gdBox.addEventListener('input', (e) => {
                        gdBoxVal.textContent = (parseFloat(e.target.value) / 100).toFixed(2);
                    });
                }
                
                const gdText = document.getElementById('gdTextThreshold');
                const gdTextVal = document.getElementById('gdTextThresholdValue');
                if (gdText && gdTextVal) {
                    gdText.addEventListener('input', (e) => {
                        gdTextVal.textContent = (parseFloat(e.target.value) / 100).toFixed(2);
                    });
                }
                
                // Grounded-SAM-2 threshold sliders
                const gsBox = document.getElementById('gsBoxThreshold');
                const gsBoxVal = document.getElementById('gsBoxThresholdValue');
                if (gsBox && gsBoxVal) {
                    gsBox.addEventListener('input', (e) => {
                        gsBoxVal.textContent = (parseFloat(e.target.value) / 100).toFixed(2);
                    });
                }
                
                const gsText = document.getElementById('gsTextThreshold');
                const gsTextVal = document.getElementById('gsTextThresholdValue');
                if (gsText && gsTextVal) {
                    gsText.addEventListener('input', (e) => {

            (function initJoysticks() {

                const leftStick = document.getElementById('leftJoystickStick');
                const rightStick = document.getElementById('rightJoystickStick');

                const rightValue = document.getElementById('rightJoystickValue');

                    });

                }
                
                console.log('[Joysticks] All elements found, initializing...');
                
                let leftActive = false;
                let rightActive = false;
                let leftState = { x: 0, y: 0 };
                let rightState = { x: 0, y: 0 };
                let animationFrameId = null;
                
                // Expose joystick states globally for takeoff/landing integration
                window.leftJoystickState = leftState;
                window.rightJoystickState = rightState;
                
                // Joystick parameters
                const maxDistance = 45; // pixels from center
                const deadzone = 0.1; // 10% deadzone
                const maxYawRate = 45; // degrees per second
                
                // Get speed settings from inputs
                function getSpeedSettings() {
                    const horizontalSpeedInput = document.getElementById('droneHorizontalSpeed');
                    const verticalSpeedInput = document.getElementById('droneVerticalSpeed');
                    
                    return {
                        horizontal: parseFloat(horizontalSpeedInput?.value) || 50,
                        vertical: parseFloat(verticalSpeedInput?.value) || 5
                    };
                }
                
                // Toggle joysticks visibility
                joystickBtn.addEventListener('click', () => {
                    console.log('[Joysticks] Button clicked');
                    const isActive = leftJoystick.classList.contains('active');
                    if (isActive) {
                        leftJoystick.classList.remove('active');
                        rightJoystick.classList.remove('active');
                        joystickBtn.classList.remove('active');
                        stopCameraMovement();
                        console.log('[Joysticks] Disabled');
                    } else {
                        leftJoystick.classList.add('active');
                        rightJoystick.classList.add('active');
                        joystickBtn.classList.add('active');
                        startCameraMovement();
                        console.log('[Joysticks] Enabled');
                    }
                });
                
                // Handle joystick interaction
                function setupJoystick(stick, base, valueDisplay, isLeft) {
                    let isDragging = false;
                    
                    function handleStart(e) {
                        e.preventDefault();
                        isDragging = true;
                        if (isLeft) leftActive = true;
                        else rightActive = true;
                        stick.style.transition = 'none';
                        console.log(`[Joystick] ${isLeft ? 'Left' : 'Right'} joystick activated`);
                        
                        // Handle the first movement immediately
                        handleMove(e);
                    }
                    
                    function handleMove(e) {
                        if (!isDragging) return;
                        
                        e.preventDefault();
                        const rect = base.getBoundingClientRect();
                        const centerX = rect.width / 2;
                        const centerY = rect.height / 2;
                        
                        let clientX, clientY;
                        if (e.type.includes('touch')) {
                            if (e.touches.length === 0) return;
                            clientX = e.touches[0].clientX;
                            clientY = e.touches[0].clientY;
                        } else {
                            clientX = e.clientX;
                            clientY = e.clientY;
                        }
                        
                        let deltaX = clientX - rect.left - centerX;
                        let deltaY = clientY - rect.top - centerY;
                        
                        // Limit to maxDistance
                        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                        if (distance > maxDistance) {
                            const angle = Math.atan2(deltaY, deltaX);
                            deltaX = Math.cos(angle) * maxDistance;
                            deltaY = Math.sin(angle) * maxDistance;
                        }
                        
                        // Update stick position
                        stick.style.left = `calc(50% + ${deltaX}px)`;
                        stick.style.top = `calc(50% + ${deltaY}px)`;
                        
                        // Normalize to -1 to 1
                        let normalizedX = deltaX / maxDistance;
                        let normalizedY = -deltaY / maxDistance; // Invert Y for intuitive up/down
                        
                        // Apply deadzone
                        if (Math.abs(normalizedX) < deadzone) normalizedX = 0;
                        if (Math.abs(normalizedY) < deadzone) normalizedY = 0;
                        
                        // Update state
                        if (isLeft) {
                            leftState = { x: normalizedX, y: normalizedY };
                            window.leftJoystickState = leftState;
                            valueDisplay.textContent = `${normalizedX.toFixed(2)}, ${normalizedY.toFixed(2)}`;
                        } else {
                            rightState = { x: normalizedX, y: normalizedY };
                            window.rightJoystickState = rightState;
                            valueDisplay.textContent = `${normalizedX.toFixed(2)}, ${normalizedY.toFixed(2)}`;
                        }
                    }
                    
                    function handleEnd(e) {
                        if (!isDragging) return;
                        
                        e.preventDefault();
                        isDragging = false;
                        if (isLeft) leftActive = false;
                        else rightActive = false;
                        
                        stick.style.transition = 'all 0.2s ease';
                        stick.style.left = '50%';
                        stick.style.top = '50%';
                        
                        if (isLeft) {

                    base.addEventListener('mousedown', handleStart);
                    document.addEventListener('mousemove', handleMove);
                    document.addEventListener('mouseup', handleEnd);
                    
                    // Touch events - attach to the entire base
                    base.addEventListener('touchstart', handleStart, { passive: false });
                    document.addEventListener('touchmove', handleMove, { passive: false });
                    document.addEventListener('touchend', handleEnd);
                    document.addEventListener('touchcancel', handleEnd);

                setupJoystick(leftStick, leftJoystick.querySelector('.joystick-base'), leftValue, true);
                setupJoystick(rightStick, rightJoystick.querySelector('.joystick-base'), rightValue, false);
                
                // Camera movement loop - QGC Mode 2 mapping
                function updateCameraMovement() {
                    const viewer = window.AppState?.viewer || window.viewer;
                    if (!viewer || !viewer.camera) {
                        animationFrameId = requestAnimationFrame(updateCameraMovement);
                        return;
                    }
                    
                    const camera = viewer.camera;
                    const position = camera.positionCartographic;
                    
                    // Get current orientation
                    const heading = camera.heading;
                    const pitch = camera.pitch;
                    const roll = camera.roll;
                    
                    // Get current speed settings
                    const speeds = getSpeedSettings();
                    
                    // ========== QGC MODE 2: LEFT PHYSICAL STICK = THROTTLE (Y) + YAW (X) ==========
                    // Note: rightState = left physical stick (CSS: left: 40px)
                    // Right joystick element: altitude/throttle (Y) and yaw/rotation (X)
                    if (rightState.x !== 0 || rightState.y !== 0) {
                        const yawRate = rightState.x * maxYawRate * (Math.PI / 180); // Convert to radians
                        const climbRate = rightState.y * speeds.vertical;
                        
                        // Yaw rotation (left/right rotation)
                        if (rightState.x !== 0) {
                            const newHeading = heading + (yawRate * 0.016);
                            camera.setView({
                                destination: camera.position,
                                orientation: {
                                    heading: newHeading,
                                    pitch: pitch,
                                    roll: roll
                                }
                            });
                        }
                        
                        // Throttle (altitude up/down)
                        if (rightState.y !== 0) {
                            const moveDistance = climbRate * 0.016;
                            camera.moveUp(moveDistance);
                        }
                    }
                    
                    // ========== QGC MODE 2: RIGHT PHYSICAL STICK = PITCH (Y) + ROLL (X) ==========
                    // Note: leftState = right physical stick (CSS: right: 40px)
                    // Left joystick element: pitch/forward-backward (Y) and roll/strafe (X)
                    if (leftState.x !== 0 || leftState.y !== 0) {
                        const forwardSpeed = leftState.y * speeds.horizontal; // Pitch: Forward/backward
                        const strafeSpeed = leftState.x * speeds.horizontal; // Roll: Left/right strafe
                        
                        // Calculate movement in world space
                        const forwardVector = Cesium.Cartesian3.normalize(
                            new Cesium.Cartesian3(
                                Math.sin(heading),
                                Math.cos(heading),
                                0
                            ),
                            new Cesium.Cartesian3()
                        );
                        
                        const rightVector = Cesium.Cartesian3.normalize(
                            new Cesium.Cartesian3(
                                Math.cos(heading),
                                -Math.sin(heading),
                                0
                            ),
                            new Cesium.Cartesian3()
                        );
                        
                        // Move camera
                        const moveDistance = forwardSpeed * 0.016; // ~60fps
                        const strafeDistance = strafeSpeed * 0.016;
                        
                        camera.moveForward(moveDistance);
                        camera.moveRight(strafeDistance);
                    }
                    
                    animationFrameId = requestAnimationFrame(updateCameraMovement);

                    window.rightJoystickState = rightState;

                const viewer = getViewer();
                const carto = Cesium.Cartographic.fromRadians(lon, lat);

                    const [s] = await Cesium.sampleTerrainMostDetailed(viewer.terrainProvider, [carto]);
                    if (Number.isFinite(s.height)) return s.height;
                } catch (e) { /* ellipsoid or unavailable terrain */ }

            function viewTarget() {

                const centre = new Cesium.Cartesian2(canvas.clientWidth / 2, canvas.clientHeight / 2);
                const ray = viewer.camera.getPickRay(centre);
                const hit = (ray && viewer.scene.globe.pick(ray, viewer.scene)) ||
                    viewer.camera.pickEllipsoid(centre);
                return hit ? Cesium.Cartographic.fromCartesian(hit) : null;
            }
            
            async function currentView() {

                    lon: Cesium.Math.toDegrees(cam.longitude),
                    height_agl: cam.height - ground,
                    heading_deg: Cesium.Math.toDegrees(viewer.camera.heading),

            async function nominatim(place) {

                try {
                    const resp = await fetch(url, { signal: AbortSignal.timeout(8000) });
                    if (!resp.ok) return null;
                    const [h] = await resp.json();
                    if (!h) return null;
                    const [south, north, west, east] = h.boundingbox.map(Number);
                    const lat = Cesium.Math.toRadians(Number(h.lat));
                    const sizeM = Math.max(Cesium.Math.toRadians(east - west) * EARTH_R * Math.cos(lat),
                                           Cesium.Math.toRadians(north - south) * EARTH_R);
                    return { lon: Cesium.Math.toRadians(Number(h.lon)), lat, sizeM: sizeM > 50 ? sizeM : null,

                    return { lon: Cesium.Math.toRadians(a.lon), lat: Cesium.Math.toRadians(a.lat), sizeM: null,
                             label: `${a.lat.toFixed(4)}, ${a.lon.toFixed(4)}` };

                        const svc = new Cesium.IonGeocoderService({ scene: getViewer().scene });
                        const results = await svc.geocode(a.place);
                        if (!results || !results.length) throw new Error(`Could not find "${a.place}"`);
                        const dest = results[0].destination;
                        if (dest instanceof Cesium.Rectangle) {
                            const c = Cesium.Rectangle.center(dest);
                            const R = Cesium.Ellipsoid.WGS84.maximumRadius;
                            const w = dest.width * R * Math.cos(c.latitude), h = dest.height * R;
                            hit = { lon: c.longitude, lat: c.latitude, sizeM: Math.max(w, h) };
                        } else {
                            const c = Cesium.Cartographic.fromCartesian(dest);
                            hit = { lon: c.longitude, lat: c.latitude, sizeM: null };
                        }
                        hit.label = results[0].displayName || a.place;
                        geocodeCache.set(a.place, hit);

            // and radius; each kind in LAYERS fetches from a public, citable source, then
            // the runner draws, lists and cites what came back, so nothing is invented.
            const EARTH_R = 6371008.8;
            const deg = (r) => Cesium.Math.toDegrees(r);

            function distanceM(lon1, lat1, lon2, lat2) {
                const s = Math.sin((lat2 - lat1) / 2) ** 2 +
                    Math.cos(lat1) * Math.cos(lat2) * Math.sin((lon2 - lon1) / 2) ** 2;
                return 2 * EARTH_R * Math.asin(Math.min(1, Math.sqrt(s)));

            function insideRing(ring, x, y) {
                let inside = false;
                for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
                    const [xi, yi] = ring[i], [xj, yj] = ring[j];
                    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
                }
                return inside;
            }
            
            // Metres from (lon, lat) radians to a feature: 0 inside an outline, else the nearest vertex
            function featureDistance(f, lon, lat) {
                const g = f.geometry || {};
                const x = Cesium.Math.toDegrees(lon), y = Cesium.Math.toDegrees(lat);
                const polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
                if (polys.some(p => insideRing(p[0], x, y))) return 0;
                let best = Infinity;
                const walk = (c) => {
                    if (typeof c[0] === 'number') {
                        best = Math.min(best, distanceM(lon, lat, Cesium.Math.toRadians(c[0]), Cesium.Math.toRadians(c[1])));
                    } else c.forEach(walk);
                };
                walk(g.coordinates || []);
                return best;
            }

            // Published geologic maps anywhere (most detailed in the US) via Macrostrat:
            // sample the map at the centre and on two rings, keep the most detailed
            // map at each point, merge repeats. Each unit carries its source map.
            const MACROSTRAT_API = 'https://macrostrat.org/api/v2/geologic_units/map';
            const MACROSTRAT_TILES = 'https://tiles.macrostrat.org/carto/{z}/{x}/{y}.png';
            const MAP_SCALES = ['large', 'medium', 'small', 'tiny'];
            
            async function mapUnits(lon, lat, radius) {
                const pts = ringPoints(lon, lat, radius, [[0.5, 6], [1, 8]]);
                const hits = await Promise.all(pts.map(async ([x, y]) => {
                    try {
                        const resp = await fetch(`${MACROSTRAT_API}?` + new URLSearchParams({
                            lat: Cesium.Math.toDegrees(y).toFixed(5), lng: Cesium.Math.toDegrees(x).toFixed(5) }));
                        if (!resp.ok) return null;
                        const res = (await resp.json()).success || {};
                        const data = res.data || [];
                        const u = MAP_SCALES.map(s => data.find(d => d.scale === s)).find(Boolean);
                        return u ? { u, ref: (res.refs || {})[u.source_id], d: distanceM(lon, lat, x, y) } : null;
                    } catch (e) {
                        return null;
                    }

                const units = new Map();
                hits.filter(Boolean).forEach(h => {
                    const key = `${h.u.source_id}|${h.u.name}`;
                    const prev = units.get(key);
                    if (prev) { prev.n++; prev.d = Math.min(prev.d, h.d); } else units.set(key, { ...h, n: 1 });
                });

            }
            
            function unitLine({ u, d }) {
                const age = u.b_int_name === u.t_int_name ? u.b_int_name : `${u.b_int_name} to ${u.t_int_name}`;
                const fmtMa = (v) => v >= 1 ? String(Math.round(v * 10) / 10) : String(+v.toPrecision(2));
                const ma = Number.isFinite(u.b_int_age) && Number.isFinite(u.t_int_age)
                    ? ` (${fmtMa(u.b_int_age)}-${fmtMa(u.t_int_age)} Ma)` : '';

                const where = d < 1 ? 'at the centre' : `nearest ${fmtM(d)}`;
                return `${u.name}: ${age}${ma}${rock ? '; ' + rock : ''} [${where}]`;

            function offsetPoint(lon, lat, east, north) {
                return [lon + east / (EARTH_R * Math.cos(lat)), lat + north / EARTH_R];

            function ringPoints(lon, lat, radius, rings) {

                    for (let k = 0; k < n; k++) {
                        const t = 2 * Math.PI * k / n;

            async function fetchJson(url, opts = {}, timeoutMs = 25000) {
                const host = new URL(url).host;
                const ctl = new AbortController();
                const timer = setTimeout(() => ctl.abort(), timeoutMs);
                opts.signal?.addEventListener('abort', () => ctl.abort());
                try {
                    const resp = await fetch(url, { ...opts, signal: ctl.signal });
                    if (!resp.ok) throw new Error(`${host} returned HTTP ${resp.status}`);
                    const text = await resp.text();
                    try { return JSON.parse(text); } catch (e) { throw new Error(`${host} is unavailable right now (not a data response)`); }
                } catch (e) {
                    if (e.name === 'AbortError') throw new Error(`${host} did not respond`);
                    throw e;
                } finally {
                    clearTimeout(timer);
                }
            }

                    geometry: JSON.stringify({ x: deg(p.lon), y: deg(p.lat), spatialReference: { wkid: 4326 } }),
                    distance: String(Math.round(radius)), units: 'esriSRUnit_Meter',
                    spatialRel: 'esriSpatialRelIntersects', outSR: '4326', geometryPrecision: '5',
                    returnGeometry: 'true', f: 'geojson', ...params,

                return fc;

                const anchors = links.filter(l => /^https?:\/\//.test(l[1] || ''))
                    .map(l => `<p><a href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])}</a></p>`).join('');

                    const la = lat + radius * Math.sin(t) / EARTH_R;

                return pts;

                            })).catch(() => null);
                            (iv?.value?.timeSeries || []).forEach(ts => {

                                const q = v ? Number(v.value) : NaN;
                                if (Number.isFinite(q) && q > -999999) {
                                    live.set(ts.sourceInfo.siteCode[0].value, { q, t: v.dateTime });

                        const gauges = sites.features.map((f, i) => {

                            decorate(e, q) {
