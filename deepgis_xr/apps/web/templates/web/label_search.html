    <script>
        // ========== TAKEOFF AND LAND FUNCTIONALITY ==========
        (function initTakeoffLand() {
            const takeoffBtn = document.getElementById('droneTakeoffBtn');
            const landBtn = document.getElementById('droneLandBtn');
            const verticalSpeedInput = document.getElementById('droneVerticalSpeed');
            
            if (!takeoffBtn || !landBtn || !verticalSpeedInput) {
                console.error('[Takeoff/Land] Missing required elements');
                return;
            }
            
            let isClimbing = false;
            let isDescending = false;
            let animationId = null;
            let targetHeight = null; // ellipsoid height to stop at (AI pilot); null = until stopped
            
            // Move along the local vertical; camera.moveUp follows the view's up
            // vector, which is horizontal when the gimbal points straight down.
            function moveVertical(camera, distance) {
                const up = Cesium.Ellipsoid.WGS84.geodeticSurfaceNormal(camera.position, new Cesium.Cartesian3());
                camera.move(up, distance);
            }
            
            // Takeoff function
            function startTakeoff(target) {
                if (isClimbing) {
                    stopVerticalMovement();
                    return;
                }
                targetHeight = typeof target === 'number' ? target : null;
                
                const viewer = window.AppState?.viewer || window.viewer;
                if (!viewer || !viewer.camera) {
                    console.error('[Takeoff] Viewer not available');
                    return;
                }
                
                isClimbing = true;
                isDescending = false;
                takeoffBtn.classList.add('active');
                takeoffBtn.innerHTML = '<i class="fas fa-stop"></i> Stop';
                landBtn.disabled = true;
                
                const verticalSpeed = parseFloat(verticalSpeedInput.value) || 5;
                
                // Store initial heading when starting takeoff
                let currentHeading = viewer.camera.heading;
                const maxYawRate = 45; // degrees per second (same as joystick)
                
                console.log(`[Takeoff] Starting climb at ${verticalSpeed} m/s (gimbal + joystick yaw control enabled)`);
                
                function climb() {
                    if (!isClimbing) return;
                    
                    const camera = viewer.camera;
                    if (targetHeight !== null && camera.positionCartographic.height >= targetHeight) {
                        stopVerticalMovement();
                        return;
                    }
                    const moveDistance = verticalSpeed * 0.016; // ~60fps
                    
                    // Get joystick state for yaw rate control
                    // Note: rightState = left physical stick (has yaw on X-axis)
                    const rightJoystickState = window.rightJoystickState || { x: 0, y: 0 };
                    const joystickYawRate = rightJoystickState.x * maxYawRate * (Math.PI / 180); // rad/s
                    
                    // Apply joystick yaw rate to current heading
                    if (joystickYawRate !== 0) {
                        currentHeading = currentHeading + (joystickYawRate * 0.016);
                    }
                    
                    // Apply gimbal control (pitch and yaw offset from sliders)
                    const pitchSlider = document.getElementById('droneOrbitPitch');
                    const yawSlider = document.getElementById('droneOrbitYaw');
                    
                    if (pitchSlider && yawSlider) {
                        const pitchDegrees = parseFloat(pitchSlider.value) || -10;
                        const yawDegrees = parseFloat(yawSlider.value) || 0;
                        
                        // Apply yaw offset to current heading
                        // Current heading includes joystick yaw adjustments
                        // Yaw slider adds gimbal offset
                        const yawOffsetRadians = Cesium.Math.toRadians(yawDegrees);
                        const finalHeading = Cesium.Math.zeroToTwoPi(currentHeading + yawOffsetRadians);
                        const finalPitch = Cesium.Math.toRadians(pitchDegrees);
                        
                        // Move up while maintaining orientation
                    moveVertical(camera, moveDistance);
                        
                        // Apply gimbal orientation (heading + yaw offset, pitch from slider)
                        camera.setView({
                            destination: camera.position,
                            orientation: {
                                heading: finalHeading,
                                pitch: finalPitch,
                                roll: 0
                            }
                        });
                    } else {
                        // Fallback: just move up without gimbal control
                        moveVertical(camera, moveDistance);
                    }
                    
                    animationId = requestAnimationFrame(climb);
                }
                
                climb();
            }
            
            // Land function
            function startLanding(target) {
                if (isDescending) {
                    stopVerticalMovement();
                    return;
                }
                targetHeight = typeof target === 'number' ? target : null;
                
                const viewer = window.AppState?.viewer || window.viewer;
                if (!viewer || !viewer.camera) {
                    console.error('[Land] Viewer not available');
                    return;
                }
                
                isDescending = true;
                isClimbing = false;
                landBtn.classList.add('active');
                landBtn.innerHTML = '<i class="fas fa-stop"></i> Stop';
                takeoffBtn.disabled = true;
                
                const verticalSpeed = parseFloat(verticalSpeedInput.value) || 5;
                
                // Store initial heading when starting landing
                let currentHeading = viewer.camera.heading;
                const maxYawRate = 45; // degrees per second (same as joystick)
                
                console.log(`[Land] Starting descent at ${verticalSpeed} m/s (gimbal + joystick yaw control enabled)`);
                
                function descend() {
                    if (!isDescending) return;
                    
                    const camera = viewer.camera;
                    if (targetHeight !== null && camera.positionCartographic.height <= targetHeight) {
                        stopVerticalMovement();
                        return;
                    }
                    const moveDistance = verticalSpeed * 0.016; // ~60fps
                    
                    // Get joystick state for yaw rate control
                    // Note: rightState = left physical stick (has yaw on X-axis)
                    const rightJoystickState = window.rightJoystickState || { x: 0, y: 0 };
                    const joystickYawRate = rightJoystickState.x * maxYawRate * (Math.PI / 180); // rad/s
                    
                    // Apply joystick yaw rate to current heading
                    if (joystickYawRate !== 0) {
                        currentHeading = currentHeading + (joystickYawRate * 0.016);
                    }
                    
                    // Apply gimbal control (pitch and yaw offset from sliders)
                    const pitchSlider = document.getElementById('droneOrbitPitch');
                    const yawSlider = document.getElementById('droneOrbitYaw');
                    
                    if (pitchSlider && yawSlider) {
                        const pitchDegrees = parseFloat(pitchSlider.value) || -10;
                        const yawDegrees = parseFloat(yawSlider.value) || 0;
                        
                        // Apply yaw offset to current heading
                        // Current heading includes joystick yaw adjustments
                        // Yaw slider adds gimbal offset
                        const yawOffsetRadians = Cesium.Math.toRadians(yawDegrees);
                        const finalHeading = Cesium.Math.zeroToTwoPi(currentHeading + yawOffsetRadians);
                        const finalPitch = Cesium.Math.toRadians(pitchDegrees);
                        
                        // Move down while maintaining orientation
                    moveVertical(camera, -moveDistance);
                        
                        // Apply gimbal orientation (heading + yaw offset, pitch from slider)
                        camera.setView({
                            destination: camera.position,
                            orientation: {
                                heading: finalHeading,
                                pitch: finalPitch,
                                roll: 0
                            }
                        });
                    } else {
                        // Fallback: just move down without gimbal control
                        moveVertical(camera, -moveDistance);
                    }
                    
                    animationId = requestAnimationFrame(descend);
                }
                
                descend();
            }
            
            // Stop vertical movement
            function stopVerticalMovement() {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                
                isClimbing = false;
                isDescending = false;
                targetHeight = null;
                
                takeoffBtn.classList.remove('active');
                takeoffBtn.innerHTML = '<i class="fas fa-arrow-up"></i> Takeoff';
                takeoffBtn.disabled = false;
                
                landBtn.classList.remove('active');
                landBtn.innerHTML = '<i class="fas fa-arrow-down"></i> Land';
                landBtn.disabled = false;
                
                console.log('[Vertical Movement] Stopped');
            }
            
            // Event listeners
            takeoffBtn.addEventListener('click', () => startTakeoff());
            landBtn.addEventListener('click', () => startLanding());
            
            // Programmatic control (AI pilot): climb/descend to an ellipsoid height
            window.DeepGISDrone = Object.assign(window.DeepGISDrone || {}, {
                climbTo(height) { stopVerticalMovement(); startTakeoff(height); },
                descendTo(height) { stopVerticalMovement(); startLanding(height); },
                stopVertical: stopVerticalMovement,
                isVerticalActive: () => isClimbing || isDescending,
            });
            
            // Stop on Escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && (isClimbing || isDescending)) {
                    stopVerticalMovement();
                }
            });
            
            console.log('[Takeoff/Land] Initialized');
        })();
        
        // ========== LIVE GIMBAL CONTROL (Pitch & Yaw) ==========
        (function initLiveGimbalControl() {
            const pitchSlider = document.getElementById('droneOrbitPitch');
            const pitchValue = document.getElementById('orbitPitchValue');
            const yawSlider = document.getElementById('droneOrbitYaw');
            const yawValue = document.getElementById('orbitYawValue');
            
            if (!pitchSlider || !pitchValue || !yawSlider || !yawValue) {
                console.error('[Gimbal Control] Missing required elements');
                return;
            }
            
            // Check if orbit is active
            function isOrbitActive() {
                const orbitBtn = document.getElementById('droneOrbitBtn');
                return orbitBtn && orbitBtn.classList.contains('active');
            }
            
            // Check if takeoff or landing is active
            function isVerticalMovementActive() {
                const takeoffBtn = document.getElementById('droneTakeoffBtn');
                const landBtn = document.getElementById('droneLandBtn');
                return (takeoffBtn && takeoffBtn.classList.contains('active')) ||
                       (landBtn && landBtn.classList.contains('active'));
            }
            
            // Update pitch display and camera (except during orbit/takeoff/landing - they handle it)
            pitchSlider.addEventListener('input', (e) => {
                const pitchDegrees = parseFloat(e.target.value);
                pitchValue.textContent = `${pitchDegrees}°`;
                
                // Only update camera if not orbiting, taking off, or landing
                // (those animations handle pitch/yaw themselves)
                if (!isOrbitActive() && !isVerticalMovementActive()) {
                    const viewer = window.AppState?.viewer || window.viewer;
                    if (!viewer || !viewer.camera) {
                        return;
                    }
                    
                    const camera = viewer.camera;
                    const heading = camera.heading;
                    const roll = camera.roll;
                    const pitchRadians = Cesium.Math.toRadians(pitchDegrees);
                    
                    camera.setView({
                        destination: camera.position,
                        orientation: {
                            heading: heading,
                            pitch: pitchRadians,
                            roll: roll
                        }
                    });
                }
            });
            
            // Update yaw display and camera (except during orbit/takeoff/landing - they handle it)
            yawSlider.addEventListener('input', (e) => {
                const yawDegrees = parseFloat(e.target.value);
                yawValue.textContent = `${yawDegrees}°`;
                
                // Apply yaw rotation when not in special modes
                if (!isOrbitActive() && !isVerticalMovementActive()) {
                    const viewer = window.AppState?.viewer || window.viewer;
                    if (!viewer || !viewer.camera) {
                        return;
                    }
                    
                    const camera = viewer.camera;
                    const pitch = camera.pitch;
                    const roll = camera.roll;
                    
                    // Convert yaw offset to absolute heading
                    const yawOffsetRadians = Cesium.Math.toRadians(yawDegrees);
                    const baseHeading = 0; // North
                    const newHeading = Cesium.Math.zeroToTwoPi(baseHeading + yawOffsetRadians);
                    
                    camera.setView({
                        destination: camera.position,
                        orientation: {
                            heading: newHeading,
                            pitch: pitch,
                            roll: roll
                        }
                    });
                }
                // During orbit/takeoff/landing, yaw is applied by those animations
            });
            
            console.log('[Gimbal Control] Live pitch and yaw control initialized (works with orbit, takeoff, and landing)');
        })();
        
        // ========== QGROUNDCONTROL-STYLE ORBIT IMPLEMENTATION (ENHANCED) ==========
        (function initDroneOrbit() {
            const orbitBtn = document.getElementById('droneOrbitBtn');
            const stopOrbitBtn = document.getElementById('stopOrbitBtn');
            const pauseOrbitBtn = document.getElementById('pauseOrbitBtn');
            const stopOrbitContainer = document.getElementById('stopOrbitContainer');
            const pauseOrbitContainer = document.getElementById('pauseOrbitContainer');
            const orbitProgressContainer = document.getElementById('orbitProgressContainer');
            const orbitProgressText = document.getElementById('orbitProgressText');
            const orbitRadiusInput = document.getElementById('droneOrbitRadius');
            const orbitPitchInput = document.getElementById('droneOrbitPitch');
            const horizontalSpeedInput = document.getElementById('droneHorizontalSpeed');
            const revolutionsInput = document.getElementById('droneOrbitRevolutions');
            
            if (!orbitBtn || !stopOrbitBtn) {
                console.error('[Orbit] Missing required elements');
                return;
            }
            
            let isOrbiting = false;
            let isPaused = false;
            let orbitAnimationId = null;
            let orbitStartTime = null;
            let orbitLastFrameTime = null;
            let orbitPausedTime = 0; // Total time spent paused
            let orbitCenterPoint = null;
            let orbitInitialAngle = 0; // Starting angle in orbit (radians)
            let orbitDirection = 1; // 1 = counter-clockwise seen from above, -1 = clockwise
            let orbitStartAltitude = 0; // Altitude when orbit started (maintains current altitude)
            let lastVerificationTime = 0; // For performance optimization
            let lastProgressUpdateTime = 0; // For UI updates
            
            // Start orbit (QGC-style: use current position as center by default)
            function startOrbit() {
                if (isOrbiting) {
                    stopOrbit();
                    return;
                }
                
                const viewer = window.AppState?.viewer || window.viewer;
                if (!viewer || !viewer.camera) {
                    console.error('[Orbit] Viewer not available');
                    return;
                }
                
                orbitDirection = 1;
                
                // QGC behavior: Use current camera position as orbit center
                const camera = viewer.camera;
                const currentPosition = camera.positionCartographic;
                
                // Set center point at ground level (directly below current camera position)
                orbitCenterPoint = Cesium.Cartesian3.fromRadians(
                    currentPosition.longitude,
                    currentPosition.latitude,
                    0 // Ground level
                );
                
                // Log center point for debugging
                const centerCart = Cesium.Cartographic.fromCartesian(orbitCenterPoint);
                console.log(`[Orbit] Center set at: ${Cesium.Math.toDegrees(centerCart.longitude).toFixed(6)}°, ${Cesium.Math.toDegrees(centerCart.latitude).toFixed(6)}°`);
                console.log(`[Orbit] Current camera at: ${Cesium.Math.toDegrees(currentPosition.longitude).toFixed(6)}°, ${Cesium.Math.toDegrees(currentPosition.latitude).toFixed(6)}°, ${currentPosition.height.toFixed(1)}m`);
                
                startOrbitWithCenter();
            }
            
            // Start orbit with established center point
            function startOrbitWithCenter() {
                const viewer = window.AppState?.viewer || window.viewer;
                if (!viewer || !viewer.camera || !orbitCenterPoint) {
                    console.error('[Orbit] Cannot start orbit');
                    return;
                }
                
                // Get parameters
                const radius = parseFloat(orbitRadiusInput.value) || 5000;
                const horizontalSpeed = parseFloat(horizontalSpeedInput.value) || 50; // m/s
                const maxRevolutions = parseFloat(revolutionsInput?.value) || 10;
                
                const camera = viewer.camera;
                const currentPosition = camera.positionCartographic;
                
                // Store current altitude - orbit will maintain this altitude
                orbitStartAltitude = currentPosition.height;
                
                // Initialize orbit state BEFORE calculating angle
                console.log(`[Orbit] Starting enhanced orbit: ${radius}m radius, ${maxRevolutions} revolutions, altitude ${orbitStartAltitude.toFixed(1)}m`);
                isOrbiting = true;
                isPaused = false;
                orbitStartTime = Date.now();
                orbitLastFrameTime = Date.now();
                orbitPausedTime = 0;
                lastVerificationTime = 0;
                lastProgressUpdateTime = 0;
                
                // Update UI
                orbitBtn.classList.add('active');
                orbitBtn.innerHTML = '<i class="fas fa-stop"></i> Stop Orbit';
                stopOrbitContainer.style.display = 'block';
                if (pauseOrbitContainer) pauseOrbitContainer.style.display = 'block';
                if (orbitProgressContainer) orbitProgressContainer.style.display = 'block';
                
                // Calculate initial angle from current position
                calculateInitialAngle(currentPosition);
                
                function calculateInitialAngle(position) {
                    // Calculate initial angle based on position relative to center
                    const centerCartographic = Cesium.Cartographic.fromCartesian(orbitCenterPoint);
                    // Scale longitude to ground distance so the angle matches the east/north
                    // offsets used by animateOrbit (otherwise the camera jumps at high latitude).
                    const deltaLon = (position.longitude - centerCartographic.longitude) * Math.cos(centerCartographic.latitude);
                    const deltaLat = position.latitude - centerCartographic.latitude;
                    
                    // If camera is directly above center (or very close), start at angle 0 (north)
                    const distanceFromCenter = Math.sqrt(deltaLon * deltaLon + deltaLat * deltaLat);
                    if (distanceFromCenter < 0.00001) { // Less than ~1 meter
                        orbitInitialAngle = 0; // Start pointing north
                        console.log(`[Orbit] Camera at center, starting from north (0°)`);
                    } else {
                        orbitInitialAngle = Math.atan2(deltaLat, deltaLon);
                        console.log(`[Orbit] Initial angle: ${(orbitInitialAngle * 180 / Math.PI).toFixed(1)}°`);
                    }
                    
                    // Start orbit animation with smooth transition
                    startOrbitAnimation();
                }
            }
            
            // Start orbit animation (called after initial angle is calculated)
            function startOrbitAnimation() {
                if (!isOrbiting) return;
                
                // Enhanced orbit animation with all improvements
                function animateOrbit() {
                    if (!isOrbiting) return;
                    
                    // Handle pause state
                    if (isPaused) {
                        orbitAnimationId = requestAnimationFrame(animateOrbit);
                        return;
                    }
                    
                    const viewer = window.AppState?.viewer || window.viewer;
                    if (!viewer || !viewer.camera) {
                        stopOrbit();
                        return;
                    }
                    
                    const camera = viewer.camera;
                    const pitchRaw = parseFloat(orbitPitchInput.value);
                    const pitchDegrees = Number.isFinite(pitchRaw) ? pitchRaw : -10;
                    const yawRaw = parseFloat(document.getElementById('droneOrbitYaw')?.value);
                    const yawOffsetDegrees = Number.isFinite(yawRaw) ? yawRaw : 50;
                    const radius = parseFloat(orbitRadiusInput.value) || 5000;
                    const horizontalSpeed = parseFloat(horizontalSpeedInput.value) || 50; // m/s
                    const maxRevolutions = parseFloat(revolutionsInput?.value) || 10;
                    
                    // Validate radius
                    if (radius <= 0) {
                        console.error('[Orbit] Invalid radius, stopping');
                        stopOrbit();
                        return;
                    }
                    
                    // Calculate angular velocity (radians per second)
                    const angularVelocity = horizontalSpeed / radius; // rad/s
                    
                    // Calculate angle based on elapsed time (accounting for paused time)
                    const currentTime = Date.now();
                    const elapsed = (currentTime - orbitStartTime - orbitPausedTime) / 1000; // seconds
                    const deltaTime = (currentTime - orbitLastFrameTime) / 1000; // seconds since last frame
                    orbitLastFrameTime = currentTime;
                    
                    // Calculate current angle from elapsed time
                    const currentRadiansFromStart = angularVelocity * elapsed;
                    const orbitAngle = orbitInitialAngle + orbitDirection * currentRadiansFromStart;
                    
                    // ========== REVOLUTION COUNTING & AUTO-STOP ==========
                    const totalRadians = maxRevolutions * 2 * Math.PI;
                    const completedRevolutions = currentRadiansFromStart / (2 * Math.PI);
                    
                    // Check if completed all revolutions
                    if (currentRadiansFromStart >= totalRadians) {
                        console.log(`[Orbit] Completed ${maxRevolutions} revolutions - auto-stopping`);
                        stopOrbit();
                        return;
                    }
                    
                    // Update progress display (throttled to every 100ms)
                    if (orbitProgressText && currentTime - lastProgressUpdateTime > 100) {
                        orbitProgressText.textContent = `Revolution: ${completedRevolutions.toFixed(2)} / ${maxRevolutions.toFixed(2)}`;
                        lastProgressUpdateTime = currentTime;
                    }
                    
                    // ========== PERFECT CIRCLE COORDINATE TRANSFORMATION ==========
                    const centerCartographic = Cesium.Cartographic.fromCartesian(orbitCenterPoint);
                    const ellipsoid = viewer.scene.globe.ellipsoid;
                    
                    // Use small-circle mathematics for perfect circular orbits
                    // This maintains constant distance from center (not great circle)
                    const bearing = orbitAngle;
                    const centerLon = centerCartographic.longitude;
                    const centerLat = centerCartographic.latitude;
                    
                    // Calculate offset in local tangent plane (ENU coordinates)
                    // East component
                    const east = radius * Math.cos(bearing);
                    // North component
                    const north = radius * Math.sin(bearing);
                    
                    // Convert ENU offset to lat/lon changes
                    // This creates a perfect circle in the local tangent plane
                    const earthRadius = ellipsoid.maximumRadius;
                    
                    // Delta latitude (north-south is simple)
                    const deltaLat = north / earthRadius;
                    
                    // Delta longitude (east-west requires latitude correction)
                    // At higher latitudes, longitude lines are closer together
                    const deltaLon = east / (earthRadius * Math.cos(centerLat));
                    
                    // Calculate final position
                    const cameraLatitude = centerLat + deltaLat;
                    const cameraLongitude = centerLon + deltaLon;
                    
                    // ========== CIRCLE ACCURACY VERIFICATION ==========
                    const VERIFICATION_INTERVAL = 5000; // 5 seconds
                    if (currentTime - lastVerificationTime > VERIFICATION_INTERVAL) {
                        const currentPos = Cesium.Cartesian3.fromRadians(cameraLongitude, cameraLatitude, orbitStartAltitude);
                        const actualDistance = Cesium.Cartesian3.distance(currentPos, orbitCenterPoint);
                        const error = Math.abs(actualDistance - radius);
                        const errorPercent = (error / radius * 100).toFixed(3);
                        const bearing = Cesium.Math.toDegrees(orbitAngle % (2 * Math.PI));

                if (polys.some(p => insideRing(p[0], x, y))) return 0;

            const NIFC_URL = 'https://services3.arcgis.com/T4QMspbfLg3qTGWY/arcgis/rest/services/' +
                'InterAgencyFirePerimeterHistory_All_Years_View/FeatureServer/0';
            const NLDI_URL = 'https://api.water.usgs.gov/nldi/linked-data';
            const NWIS_IV_URL = 'https://waterservices.usgs.gov/nwis/iv/';
            const NLCD_WMS = 'https://www.mrlc.gov/geoserver/mrlc_display/NLCD_2021_Land_Cover_L48/wms';
            const NLCD_LAYER = 'NLCD_2021_Land_Cover_L48';
            const SDA_URL = 'https://sdmdataaccess.sc.egov.usda.gov/Tabular/post.rest';
            const SDM_WMS = 'https://sdmdataaccess.sc.egov.usda.gov/Spatial/SDM.wms';
            const INAT_URL = 'https://api.inaturalist.org/v1';
            // The public Overpass instance is often at capacity; try mirrors in turn
            const OVERPASS_URLS = ['https://overpass-api.de/api/interpreter',
                'https://maps.mail.ru/osm/tools/overpass/api/interpreter', 'https://overpass.private.coffee/api/interpreter'];
            
            function faultColor(age = '') {
                const a = String(age).toLowerCase();
                if (a.includes('historic')) return Cesium.Color.RED;
                if (a.includes('latest')) return Cesium.Color.ORANGERED;
                if (a.startsWith('late')) return Cesium.Color.ORANGE;
                if (a.includes('middle')) return Cesium.Color.YELLOW;
                return Cesium.Color.LIGHTGRAY;
            }
            
            const FLOOD_ZONES = {
                A: '1% annual chance (100-year) flood, no base flood elevation',
                AE: '1% annual chance (100-year) flood, base flood elevation set',
                AH: '1% annual chance shallow ponding, 1-3 ft deep',
                AO: '1% annual chance sheet flow, 1-3 ft deep',
                AR: '1% annual chance flood, levee being restored',
                A99: '1% annual chance flood, levee under construction',
                V: 'coastal high hazard (1% annual chance)',
                VE: 'coastal high hazard (1% annual chance) with wave action',
                D: 'possible but undetermined flood hazard',
            };
            
            function floodLabel(q) {
                const sub = String(q.ZONE_SUBTY || '').trim();
                if (q.FLD_ZONE === 'X') {
                    if (sub.includes('0.2')) return 'Zone X (shaded): 0.2% annual chance (500-year) flood';
                    return sub ? `Zone X: ${sub.toLowerCase()}` : 'Zone X: minimal flood hazard';
                }
                const base = `Zone ${q.FLD_ZONE}: ${FLOOD_ZONES[q.FLD_ZONE] || 'special flood hazard area'}`;
                return sub.includes('FLOODWAY') ? `${base}, regulatory floodway` : base;
            }
            
            const NLCD_CLASSES = {
                11: 'Open water', 12: 'Perennial ice/snow',
                21: 'Developed, open space', 22: 'Developed, low intensity',
                23: 'Developed, medium intensity', 24: 'Developed, high intensity',
                31: 'Barren land (rock, sand, clay)',
                41: 'Deciduous forest', 42: 'Evergreen forest', 43: 'Mixed forest',
                51: 'Dwarf scrub', 52: 'Shrub/scrub', 71: 'Grassland/herbaceous',
                72: 'Sedge/herbaceous', 73: 'Lichens', 74: 'Moss',
                81: 'Pasture/hay', 82: 'Cultivated crops',
                90: 'Woody wetlands', 95: 'Emergent herbaceous wetlands',
            };
            
            async function nlcdAt(lonDeg, latDeg) {
                const d = 0.0002;
                const j = await fetchJson(`${NLCD_WMS}?` + new URLSearchParams({
                    service: 'WMS', version: '1.1.1', request: 'GetFeatureInfo',
                    layers: NLCD_LAYER, query_layers: NLCD_LAYER, srs: 'EPSG:4326',
                    bbox: [lonDeg - d, latDeg - d, lonDeg + d, latDeg + d].join(','),
                    width: '3', height: '3', x: '1', y: '1', info_format: 'application/json',
                }));
                return j.features?.[0]?.properties?.PALETTE_INDEX;
            }
            
            // USDA Soil Data Access: SQL in, rows as objects out (form POST avoids a CORS preflight)
            async function sda(query) {
                const j = await fetchJson(SDA_URL, { method: 'POST', body: new URLSearchParams({ query, format: 'JSON+COLUMNNAME' }) });
                const [head, ...rows] = j.Table || [];
                return head ? rows.map(r => Object.fromEntries(head.map((h, i) => [h, r[i]]))) : [];
            }
            
            // Instances can each take 15-40 s when loaded, so ask all and keep the first answer
            // and retry once after quick refusals (rate limits)
            async function overpass(query) {
                for (let attempt = 0; attempt < 2; attempt++) {
                    const ctl = new AbortController();
                    const t0 = Date.now();
                    try {
                        return await Promise.any(OVERPASS_URLS.map(url => fetchJson(url,
                            { method: 'POST', body: new URLSearchParams({ data: query }), signal: ctl.signal }, 60000)));
                    } catch (e) {
                        if (Date.now() - t0 > 20000) break;
                        await new Promise(r => setTimeout(r, 5000));
                    } finally {
                        ctl.abort();
                    }
                }
                throw new Error('The OpenStreetMap feature service (Overpass) is busy; try again in a minute');
            }
            
            function osmGeoJson(elements) {
                return {
                    type: 'FeatureCollection',
                    features: elements.map(el => {
                        let geometry = null;
                        if (el.type === 'node') geometry = { type: 'Point', coordinates: [el.lon, el.lat] };
                        else if (el.geometry) geometry = { type: 'LineString', coordinates: el.geometry.map(g => [g.lon, g.lat]) };
                        else if (el.center) geometry = { type: 'Point', coordinates: [el.center.lon, el.center.lat] };
                        return geometry && { type: 'Feature', geometry, properties: { ...el.tags, osm_id: `${el.type}/${el.id}` } };
                    }).filter(Boolean),
                };
            }
            
            const around = (p, radius) => `(around:${Math.round(radius)},${deg(p.lat).toFixed(5)},${deg(p.lon).toFixed(5)})`;
            const OSM_SOURCE = 'OpenStreetMap contributors (ODbL), via the Overpass API';
            
            function osmHtml(q, rows) {
                return tableHtml([['Name', q.name], ...rows], [['View on OpenStreetMap', `https://www.openstreetmap.org/${q.osm_id}`]]);
            }
            
            function circlePositions(lon, lat, radius) {
                const pts = [];
                for (let k = 0; k <= 128; k++) {
                    const t = 2 * Math.PI * k / 128;
                    const la = lat + radius * Math.sin(t) / EARTH_R;
                    pts.push(Cesium.Cartesian3.fromRadians(lon + radius * Math.cos(t) / (EARTH_R * Math.cos(lat)), la));
                }
                return pts;
            }
            
            // Each kind: load(p, radius, action) -> {fc?, style?, decorate?(entity, props),
            // imagery?, imageryAlpha?, area?, lines: [[msgKind, text]], sources: [text], empty}
            const LAYERS = {
                geology: {
                    title: 'Geology', radius: 5000,
                    async load(p, radius) {
                        const unitsPending = mapUnits(p.lon, p.lat, radius);
                        const data = await loadGeology();
                        const found = data.features
                            .map(f => ({ f, d: featureDistance(f, p.lon, p.lat) }))
                            .filter(x => x.d <= radius)
                            .sort((x, y) => x.d - y.d);
                        const byName = new Map(found.map(x => [x.f.properties.name, x]));
                        const lines = [];
                        const sites = found.filter(x => x.f.geometry.type === 'Point');
                        if (sites.length) {
                            lines.push(['step', `Geologic sites within ${fmtM(radius)} of ${p.label} ` +
                                '(click a marker for rock units and sources):']);
                            sites.forEach(({ f, d }) => lines.push(['geo',
                                `${f.properties.name}, ${fmtM(d)}: ${f.properties.category}; ${f.properties.age}`]));
                        }
                        const { sampled, units } = await unitsPending;
                        const top = units.slice(0, 8);
                        if (top.length) {
                            lines.push(['step', `Geologic map units within ${fmtM(radius)} of ${p.label} ` +
                                `(Macrostrat, ${sampled} sample points; map overlay shown):`]);
                            top.forEach(x => lines.push(['geo', unitLine(x)]));
                        }
                        return {
                            fc: { type: 'FeatureCollection', features: found.map(x => x.f) },
                            style: { fill: Cesium.Color.ORANGE.withAlpha(0.15), markerColor: Cesium.Color.ORANGERED, markerSymbol: 'mountain' },
                            decorate(e) {
                                const hit = byName.get(e.name);
                                if (hit) e.description = geologyHtml(hit.f.properties, hit.d);
                                if (e.billboard) pinLabel(e, e.name);
                            },
                            imagery: new Cesium.UrlTemplateImageryProvider({
                                url: MACROSTRAT_TILES, tileWidth: 512, tileHeight: 512, maximumLevel: 13,
                                rectangle: areaRect(p.lon, p.lat, radius),
                                credit: new Cesium.Credit('Geologic map: Macrostrat (CC BY 4.0)'),
                            }),
                            imageryAlpha: 0.55,
                            lines,
                            sources: [...new Set(top.map(x => x.ref).filter(Boolean))],
                            empty: `No geologic data found within ${fmtM(radius)} of ${p.label}`,
                        };
                    },
                },
                
                faults: {
                    title: 'Faults', radius: 15000,
                    async load(p, radius) {
                        const fc = await arcgisNear(QFAULTS_URL, p, radius, {
                            outFields: 'fault_name,section_name,age,slip_rate,slip_sense,dip_direction,class,mapped_scale,fault_url',
                            maxAllowableOffset: '0.0001', resultRecordCount: '2000',
                        });
                        const groups = new Map();
                        fc.features.forEach(f => {
                            const q = f.properties, d = featureDistance(f, p.lon, p.lat);
                            const key = `${q.fault_name}|${q.section_name || ''}`;
                            const g = groups.get(key);
                            if (g) g.d = Math.min(g.d, d); else groups.set(key, { q, d });
                        });
                        const list = [...groups.values()].sort((x, y) => x.d - y.d);
                        const lines = list.length ? [['step', `Quaternary faults within ${fmtM(radius)} of ${p.label} ` +
                            `(USGS; ${list.length === 1 ? '1 fault' : `${list.length} faults and fault sections`}, nearest first; click a line for its report):`]] : [];
                        list.slice(0, 12).forEach(({ q, d }) => {
                            const motion = [q.slip_sense, q.slip_rate].filter(v => v && v !== 'Unspecified').join(', ');
                            const section = q.section_name ? `, ${q.section_name.replace(/\s+section$/i, '')} section` : '';
                            lines.push(['geo', `${q.fault_name}${section}: ` +
                                `last moved ${q.age || 'at an unknown time'}${motion ? `; ${motion}` : ''} [${nearestText(d)}]`]);
                        });
                        return {
                            fc, style: { stroke: Cesium.Color.ORANGERED, strokeWidth: 3 },
                            decorate(e, q) {
                                if (e.polyline) {
                                    e.polyline.material = faultColor(q.age);
                                    e.polyline.width = 3;
                                }
                                e.name = q.fault_name;
                                e.description = tableHtml([['Fault', q.fault_name], ['Section', q.section_name],
                                    ['Most recent movement', q.age], ['Slip sense', q.slip_sense], ['Slip rate', q.slip_rate],
                                    ['Dip direction', q.dip_direction], ['Class', q.class], ['Mapped at', q.mapped_scale]],
                                    [['USGS fault report', q.fault_url]]);
                            },
                            lines,
                            sources: ['U.S. Geological Survey and state geological surveys, Quaternary Fault and Fold Database of the United States'],
                            empty: `No mapped Quaternary faults within ${fmtM(radius)} of ${p.label} (the USGS database covers the US)`,
                        };
                    },
                },
                
                flood: {
                    title: 'Flood zones', radius: 3000,
                    async load(p, radius) {
                        const [fc, centre] = await Promise.all([
                            arcgisNear(FEMA_ZONES_URL, p, radius, {
                                where: "SFHA_TF = 'T' OR ZONE_SUBTY LIKE '%0.2%'",
                                outFields: 'FLD_ZONE,ZONE_SUBTY,SFHA_TF', maxAllowableOffset: '0.0001', resultRecordCount: '500',
                            }),
                            arcgisNear(FEMA_ZONES_URL, p, 1, { outFields: 'FLD_ZONE,ZONE_SUBTY,SFHA_TF', returnGeometry: 'false' })
                                .catch(() => null),
                        ]);
                        const tally = new Map();
                        fc.features.forEach(f => {
                            const k = floodLabel(f.properties);
                            tally.set(k, (tally.get(k) || 0) + 1);
                        });
                        const here = centre?.features?.[0] ? floodLabel(centre.features[0].properties) : null;
                        const lines = [];
                        if (here || tally.size) {
                            lines.push(['step', `FEMA flood zones within ${fmtM(radius)} of ${p.label} ` +
                                '(blue: 1% annual chance, orange: 0.2%; click an area for its zone):']);
                            if (here) lines.push(['geo', `At the centre: ${here}`]);
                            [...tally.entries()].sort((x, y) => y[1] - x[1])
                                .forEach(([k, n]) => lines.push(['geo', `${k}: ${plural(n, 'mapped area')}`]));
                            if (!tally.size) lines.push(['geo', 'No 1% or 0.2% annual chance flood areas mapped in the circle']);
                        }
                        return {
                            fc, style: { fill: Cesium.Color.DODGERBLUE.withAlpha(0.35) },
                            decorate(e, q) {
                                const floodway = String(q.ZONE_SUBTY || '').includes('FLOODWAY');
                                if (e.polygon) {
                                    e.polygon.material = q.SFHA_TF === 'T'
                                        ? (floodway ? Cesium.Color.NAVY : Cesium.Color.DODGERBLUE).withAlpha(0.4)
                                        : Cesium.Color.ORANGE.withAlpha(0.3);
                                }
                                e.name = `Flood zone ${q.FLD_ZONE}`;
                                e.description = tableHtml([['Zone', floodLabel(q)], ['Subtype', q.ZONE_SUBTY],
                                    ['Special flood hazard area', q.SFHA_TF === 'T' ? 'Yes' : 'No']],
                                    [['FEMA Flood Map Service Center (official maps)', 'https://msc.fema.gov/portal/home']]);
                            },
                            lines,
                            sources: ['FEMA National Flood Hazard Layer (NFHL); use the FEMA Flood Map Service Center for official determinations'],
                            empty: `No FEMA flood map data within ${fmtM(radius)} of ${p.label}; the map may not cover this area (US only)`,
                        };
                    },
                },
                
                fires: {
                    title: 'Fire perimeters', radius: 20000,
                    async load(p, radius) {
                        const fc = await arcgisNear(NIFC_URL, p, radius, {
                            outFields: 'INCIDENT,FIRE_YEAR_INT,GIS_ACRES,AGENCY,SOURCE',
                            orderByFields: 'GIS_ACRES DESC', resultRecordCount: '200', maxAllowableOffset: '0.0005',
                        });
                        const fires = new Map();
                        fc.features.forEach(f => {
                            const q = f.properties, d = featureDistance(f, p.lon, p.lat);
                            // Agencies often each map the same fire, with differently cased names
                            const key = `${String(q.INCIDENT || '').trim().toLowerCase()}|${q.FIRE_YEAR_INT}`;
                            const g = fires.get(key);
                            if (g) { g.acres = Math.max(g.acres, q.GIS_ACRES || 0); g.d = Math.min(g.d, d); }
                            else fires.set(key, { q, acres: q.GIS_ACRES || 0, d });
                        });
                        const list = [...fires.values()].sort((x, y) => y.acres - x.acres);
                        const years = list.map(x => x.q.FIRE_YEAR_INT).filter(Number.isFinite);
                        const span = years.length ? `, ${Math.min(...years)}-${Math.max(...years)}` : '';
                        const lines = list.length ? [['step', `Past fire perimeters within ${fmtM(radius)} of ${p.label} ` +
                            `(NIFC, ${plural(list.length, 'fire')}${span}${fc.features.length >= 200 ? ', largest 200 shown' : ''}; largest first):`]] : [];
                        list.slice(0, 12).forEach(({ q, acres, d }) => lines.push(['geo',
                            `${q.INCIDENT || 'Unnamed fire'} (${q.FIRE_YEAR_INT || 'year unknown'}): ` +
                            `${Math.round(acres).toLocaleString()} acres${q.AGENCY ? `, ${q.AGENCY}` : ''} [${nearestText(d)}]`]));
                        return {
                            fc, style: { fill: Cesium.Color.RED.withAlpha(0.25) },
                            decorate(e, q) {
                                if (e.polygon) e.polygon.material = Cesium.Color.RED.withAlpha(0.25);
                                e.name = `${q.INCIDENT || 'Fire'} (${q.FIRE_YEAR_INT || '?'})`;
                                e.description = tableHtml([['Fire', q.INCIDENT], ['Year', q.FIRE_YEAR_INT],
                                    ['Acres', q.GIS_ACRES && Math.round(q.GIS_ACRES).toLocaleString()],
                                    ['Agency', q.AGENCY], ['Perimeter source', q.SOURCE]]);
                            },
                            lines,
                            sources: ['National Interagency Fire Center, InterAgency Fire Perimeter History (all years)'],
                            empty: `No recorded fire perimeters within ${fmtM(radius)} of ${p.label} (NIFC history, US only)`,
                        };
                    },
                },
                
                river: {
                    title: 'River trace', radius: null,
                    async load(p, radius, a) {
                        const km = a.distance_km || 50;
                        const wkt = `POINT(${deg(p.lon).toFixed(5)} ${deg(p.lat).toFixed(5)})`;
                        const pos = await fetchJson(`${NLDI_URL}/comid/position?coords=${encodeURIComponent(wkt)}`);
                        const comid = pos.features?.[0]?.properties?.comid;
                        if (!comid) throw new Error(`No mapped stream or river at ${p.label}`);
                        const nav = `${NLDI_URL}/comid/${comid}/navigation/DM`;
                        const [flow, sites] = await Promise.all([
                            fetchJson(`${nav}/flowlines?distance=${km}`),
                            fetchJson(`${nav}/nwissite?distance=${km}`).catch(() => ({ features: [] })),
                        ]);
                        const ids = sites.features.map(f => String(f.properties.identifier || '').replace(/^USGS-/, ''));
                        const live = new Map();
                        if (ids.length) {
                            const iv = await fetchJson(`${NWIS_IV_URL}?` + new URLSearchParams({
                                // Without a period NWIS returns each gauge's last value ever, which can be decades old
                                format: 'json', parameterCd: '00060', period: 'PT12H', sites: ids.slice(0, 100).join(','),
                            })).catch(() => null);
                            (iv?.value?.timeSeries || []).forEach(ts => {
                                const v = ts.values?.[0]?.value?.slice(-1)[0];
                                const q = v ? Number(v.value) : NaN;
                                if (Number.isFinite(q) && q > -999999) {
                                    live.set(ts.sourceInfo.siteCode[0].value, { q, t: v.dateTime });
                                }
                            });
                        }
                        const gauges = sites.features.map((f, i) => {
                            const [x, y] = f.geometry.coordinates;
                            return { f, id: ids[i], name: f.properties.name, live: live.get(ids[i]),
                                     d: distanceM(p.lon, p.lat, rad(x), rad(y)) };
                        }).sort((x, y) => x.d - y.d);
                        const when = (t) => new Date(t).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
                        const flowText = (g) => g.live ? `${g.live.q.toLocaleString()} ft³/s at ${when(g.live.t)}` : 'no live discharge reading';
                        const fc = {
                            type: 'FeatureCollection',
                            features: [
                                ...flow.features.map(f => ({ ...f, properties: { kind: 'flowline' } })),
                                ...gauges.map(g => ({ type: 'Feature', geometry: g.f.geometry, properties: {
                                    kind: 'gauge', name: g.name, site: g.id, flow: flowText(g), live: !!g.live } })),
                            ],
                        };
                        const withFlow = gauges.filter(g => g.live);
                        const lines = [['step', `Downstream from ${p.label}: ${km} km traced on the NHDPlus river network, ` +
                            `${plural(gauges.length, 'USGS monitoring site')} (${withFlow.length} with live discharge):`]];
                        withFlow.forEach(g => lines.push(['geo', `${g.name} (USGS ${g.id}): ${flowText(g)} [${fmtM(g.d)} from the start]`]));
                        if (gauges.length && !withFlow.length) lines.push(['geo', 'None of the downstream sites is reporting live discharge']);
                        if (gauges.length > withFlow.length && withFlow.length) {
                            lines.push(['geo', `${plural(gauges.length - withFlow.length, 'other site')} without a live discharge reading`]);
                        }
                        return {
                            fc, style: { stroke: Cesium.Color.DODGERBLUE, strokeWidth: 4, markerColor: Cesium.Color.DODGERBLUE, markerSymbol: 'water' },
                            decorate(e, q) {
                                if (q.kind === 'flowline' && e.polyline) {
                                    e.polyline.material = Cesium.Color.DODGERBLUE;
                                    e.polyline.width = 4;
                                    e.name = 'Downstream flow path';
                                } else if (q.kind === 'gauge') {
                                    if (q.live) pinLabel(e, q.flow.split(' at ')[0]); else dot(e, Cesium.Color.LIGHTSKYBLUE);
                                    e.name = q.name;
                                    e.description = tableHtml([['Site', q.name], ['USGS site number', q.site], ['Discharge', q.flow]],
                                        [['USGS monitoring location page', `https://waterdata.usgs.gov/monitoring-location/${q.site}/`]]);
                                }
                            },
                            area: boundsArea(flow),
                            lines,
                            sources: ['USGS Network-Linked Data Index (NHDPlus V2 flowlines)',
                                'USGS Water Services instantaneous values (provisional data, subject to revision)'],
                            empty: '',
                        };
                    },
                },
                
                landcover: {
