<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeepGIS Search</title>
    
    <!-- CSRF Token for API requests -->
    {% csrf_token %}
    
    <!-- Cesium Dependencies -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    
    <!-- Additional Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" crossorigin="anonymous"></script>
    
    <!-- QR Code Generator -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js" crossorigin="anonymous"></script>

    <!-- Preload disabled due to CORS issues - using Ion Asset ID instead -->
    <!-- <link rel="preload" href="https://deepgis.org/static/deepgis/models/gltf/navagunjara-reborn-digital-twin-propane-and-solar-v4.glb" as="fetch" crossorigin="anonymous"> -->
    <link rel="dns-prefetch" href="https://cesium.com">
    
    <!-- Suppress Cesium source map 404 errors -->
    <!-- Set Cesium Ion access token from server configuration -->
    <script>
        window.CESIUM_ION_TOKEN = '{{ cesium_ion_token }}';
        Cesium.Ion.defaultAccessToken = window.CESIUM_ION_TOKEN;
    </script>
    
    <!-- Application Styles -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'web/styles/main.css' %}">
    <link rel="stylesheet" href="{% static 'web/styles/tile-catalog.css' %}">
    
    <!-- HUD Style Layout -->
    <link rel="stylesheet" href="{% static 'web/styles/hud.css' %}?v=20261029">
</head>

<body>
    <div id="cesiumContainer"></div>

    {% include "web/hud/hud.html" with hud_body="earth" %}
    <!-- Application JavaScript (built by Vite) -->
    {% load static %}
    <script type="module" src="{% static 'web/js/main.js' %}"></script>
    
    <!-- GPS Telemetry Path Loader -->
    <!-- Note: GPS Telemetry is now integrated into Mission Planner panel -->
    <!-- It will be initialized automatically when Mission Planner is created -->
    <script src="{% static 'web/js/gps-telemetry.js' %}"></script>
    
    <!-- World Sampler UI -->
    <script src="{% static 'web/js/world-sampler-ui.js' %}?v=20261023"></script>
    <!-- Urban Spectral (OSM building graph + kernelcal diagnostics) -->
    <script src="{% static 'web/js/urban-spectral-ui.js' %}"></script>
    <script src="{% static 'web/js/mission-planner.js' %}"></script>
    <script src="{% static 'web/js/widgets/altimeter.js' %}?v=20261021"></script>
    <script src="{% static 'web/js/hud/panels.js' %}?v=20261022"></script>
    <script src="{% static 'web/js/hud/shortcuts.js' %}?v=20261022"></script>
    <script src="{% static 'web/js/hud/ai-panel.js' %}?v=20261025"></script>
    <script src="{% static 'web/js/hud/joysticks.js' %}?v=20261022"></script>
    <script src="{% static 'web/js/hud/drone.js' %}?v=20261023"></script>
    <script src="{% static 'web/js/hud/pilot.js' %}?v=20261108"></script>
    <script src="{% static 'web/js/hud/models.js' %}?v=20261022"></script>
    <script src="{% static 'web/js/hud/share.js' %}?v=20261022"></script>
    <script src="{% static 'web/js/hud/qr.js' %}?v=20261022"></script>
</body>
</html>
