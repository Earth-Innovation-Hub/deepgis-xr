{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>DeepGIS Moon Viewer</title>
    
    <!-- CSRF Token for API requests -->
    {% csrf_token %}
    
    <!-- Font Preload for Performance (following LROC QuickMap pattern) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Cesium Dependencies -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <script src="{% static 'web/js/planet-bodies.js' %}?v=20261021"></script>
    <script>
        // This template serves /label/3d/moon/ and /label/3d/planet/<body>/.
        window.PLANET_BODY_ID = '{{ planet_body|default:"moon"|escapejs }}';
        window.PLANET_BODY = PlanetBodies.get(window.PLANET_BODY_ID) || PlanetBodies.get('moon');
        window.PLANET_ELLIPSOID = PlanetBodies.cesiumEllipsoid(window.PLANET_BODY, Cesium);
        window.IS_MOON = window.PLANET_BODY.id === 'moon';
        document.title = `DeepGIS ${window.PLANET_BODY.name} Viewer`;
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('[data-body-name]').forEach((el) => { el.textContent = window.PLANET_BODY.name; });
        });
    </script>
    
    <!-- Additional Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" crossorigin="anonymous"></script>
    
    <!-- Feature Detection & Cesium Ion Token -->
    <script>
        // Feature detection for Cesium requirements (similar to LROC QuickMap)
        (function() {
            var errors = [];
            var hasWebGL = false;
            
            // Check for WebGL support (critical for Cesium)
            try {
                var canvas = document.createElement("canvas");
                hasWebGL = !!(window.WebGLRenderingContext && 
                    (canvas.getContext("webgl") || canvas.getContext("experimental-webgl")));
            } catch (e) {
                hasWebGL = false;
            }
            
            // Check for required JavaScript features (matching LROC QuickMap requirements)
            if (!window.Promise) errors.push("Promise API");
            if (!hasWebGL) errors.push("WebGL");
            if (!window.Blob) errors.push("Blob API");
            if (!window.ArrayBuffer) errors.push("ArrayBuffer");
            if (!window.OffscreenCanvas) errors.push("OffscreenCanvas");
            
            // Display error if features are missing
            if (errors.length > 0) {
                document.body.innerHTML = `
                    <div style="
                        position: fixed;
                        top: 0;
                        left: 0;
                        right: 0;
                        bottom: 0;
                        background: #212328;
                        color: #ecf0f1;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        flex-direction: column;
                        font-family: Arial, sans-serif;
                        padding: 20px;
                        text-align: center;
                    ">
                        <h1 style="color: #e74c3c; margin-bottom: 20px;">Browser Compatibility Error</h1>
                        <div style="
                            background-color: #e74c3c;
                            color: #ecf0f1;
                            padding: 20px;
                            border-radius: 8px;
                            max-width: 600px;
                        ">
                            Your browser is missing required features: <strong>${errors.join(", ")}</strong>.<br><br>
                            Please use the latest versions of Chrome, Firefox, Edge, or Safari 17+.
                        </div>
                    </div>
                `;
                throw new Error("Missing required browser features");
            }
        })();
        
        // Suppress console errors for missing source maps and tile errors
        const originalConsoleError = console.error;
        const originalConsoleWarn = console.warn;
        
        console.error = function(...args) {
            const message = args.join(' ');
            // Suppress source map errors
            if (message.includes('Source map') || message.includes('sourcemap') || message.includes('.map')) {
                return;
            }
            // Suppress tile loading errors (common with public imagery services)
            if (message.includes('Failed to obtain image tile') || 
                message.includes('An error occurred in') ||
                message.includes('Failed to load image')) {
                return;
            }
            originalConsoleError.apply(console, args);
        };
        
        console.warn = function(...args) {
            const message = args.join(' ');
            // Suppress CORS warnings and 404s (we handle these gracefully)
            if (message.includes('CORS') || 
                message.includes('Cross-Origin') ||
                message.includes('Access-Control-Allow-Origin') ||
                message.includes('403 Forbidden') ||
                message.includes('404') ||
                message.includes('Not Found') ||
                message.includes('Failed to load Ion asset') ||
                message.includes('ResourceNotFound')) {
                return;
            }
            originalConsoleWarn.apply(console, args);
        };
        
        // Set Cesium Ion access token from server configuration
        window.CESIUM_ION_TOKEN = '{{ cesium_ion_token }}';
        Cesium.Ion.defaultAccessToken = window.CESIUM_ION_TOKEN;
    </script>
    
    <!-- Application Styles: the Earth viewer's, so every body looks the same -->
    <link rel="stylesheet" href="{% static 'web/styles/main.css' %}">
    <link rel="stylesheet" href="{% static 'web/styles/hud.css' %}?v=20261021">
</head>

<body>
    <div id="cesiumContainer"></div>

    <script>
        // Configuration object
        const CONFIG = {
            SIDEBAR_WIDTH: 320,
            MOON_RADIUS: PlanetBodies.meanRadius(PLANET_BODY), // the open body's mean radius (m); name kept for existing callers
            APOLLO_SITES: {
                apollo11: { name: 'Apollo 11', lon: 23.47297, lat: 0.67408, description: 'First crewed Moon landing (July 20, 1969)' },
                apollo12: { name: 'Apollo 12', lon: -23.42157, lat: -3.01239, description: 'Second crewed Moon landing (November 19, 1969)' },
                apollo14: { name: 'Apollo 14', lon: -17.47139, lat: -3.64544, description: 'Third crewed Moon landing (February 5, 1971)' },
                apollo15: { name: 'Apollo 15', lon: 3.62981, lat: 26.13224, description: 'Fourth crewed Moon landing (July 30, 1971)' },
                apollo16: { name: 'Apollo 16', lon: 15.50019, lat: -8.97301, description: 'Fifth crewed Moon landing (April 21, 1972)' },
                apollo17: { name: 'Apollo 17', lon: 30.77168, lat: 20.19080, description: 'Sixth and final crewed Moon landing (December 11, 1972)' }
            }
        };

        // Global state management
        window.DeepGISMoon = {
            viewer: null,
            moonTerrain: null,
            landingSiteEntities: [],
            measurements: [],
            measurementMode: null,
            measurementPoints: [],
            isInitialized: false,
            ...CONFIG
        };

        // Utility functions
        const Utils = {
            updateStatus: (message) => {
                document.getElementById('statusIndicator').textContent = message;
            },
            
            updateLoadingStatus: (message, progress) => {
                document.getElementById('loadingStatus').textContent = message;
                document.getElementById('loadingBar').style.width = progress + '%';
            },
            
            showSnackBar: (message, type = 'info') => {
                const colors = {
                    info: '#333',
                    success: 'var(--success-green)',
                    warning: 'var(--warning-orange)',
                    error: 'var(--danger-red)'
                };
                
                const snackbar = document.createElement('div');
                snackbar.style.cssText = `
                    position: fixed;
                    bottom: 20px;
                    left: 50%;
                    transform: translateX(-50%);
                    background-color: ${colors[type] || colors.info};
                    color: white;
                    padding: 12px 24px;
                    border-radius: var(--border-radius);
                    z-index: 10000;
                    min-width: 250px;
                    text-align: center;
                    box-shadow: var(--shadow-md);
                `;
                snackbar.textContent = message;
                document.body.appendChild(snackbar);
                
                setTimeout(() => snackbar.remove(), type === 'error' ? 5000 : 3000);
            },

            createButtonHandler: (action, statusMessage) => {
                return () => {
                    try {
                        action();
                        if (statusMessage) Utils.updateStatus(statusMessage);
                    } catch (error) {
                        console.error('Button action failed:', error);
                        Utils.updateStatus('Error: ' + error.message);
                    }
                };
            },

            formatDistance: (meters) => {
                if (meters < 1000) {
                    return meters.toFixed(2) + ' m';
                } else {
                    return (meters / 1000).toFixed(2) + ' km';
                }
            },

            formatArea: (squareMeters) => {
                if (squareMeters < 1000000) {
                    return squareMeters.toFixed(2) + ' m²';
                } else {
                    return (squareMeters / 1000000).toFixed(2) + ' km²';
                }
            }
        };

        // Initialize Cesium Moon viewer
        async function initializeCesium() {
            try {
                Utils.updateLoadingStatus('Configuring Cesium for Moon...', 20);
                
                Utils.updateLoadingStatus('Creating Moon viewer...', 40);
                const viewer = new Cesium.Viewer('cesiumContainer', {
                    animation: false,
                    baseLayerPicker: false,
                    fullscreenButton: true,
                    geocoder: false,
                    homeButton: true,
                    infoBox: true,
                    sceneModePicker: true,
                    selectionIndicator: true,
                    timeline: false,
                    navigationHelpButton: true,
                    navigationInstructionsInitiallyVisible: false,
                    scene3DOnly: false,
                    // Globe.ellipsoid is read-only: the Moon ellipsoid has to be given at
                    // construction, and the map projection carries it to the camera's
                    // positionCartographic and to 2D mode
                    globe: new Cesium.Globe(PLANET_ELLIPSOID),
                    mapProjection: new Cesium.GeographicProjection(PLANET_ELLIPSOID),
                    baseLayer: false,
                    skyAtmosphere: false
                });

                window.DeepGISMoon.viewer = viewer;
                // Also set to window.viewer for compatibility with world-sampler-ui.js auto-initialization
                window.viewer = viewer;
                
                // Trigger AI analysis initialization after viewer is ready
                setTimeout(() => {
                    if (typeof initializeSAMButtonHandler === 'function' && window.worldSamplerUI) {
                        initializeSAMButtonHandler(viewer, window.worldSamplerUI);
                        console.log('[Moon Viewer] ✅ AI Viewport Analysis initialized');
                    } else if (typeof WorldSamplerUI !== 'undefined') {
                        try {
                            window.worldSamplerUI = new WorldSamplerUI(viewer);
                            if (typeof initializeSAMButtonHandler === 'function') {
                                initializeSAMButtonHandler(viewer, window.worldSamplerUI);
                                console.log('[Moon Viewer] ✅ World Sampler UI and AI Analysis initialized');
                            }
                        } catch (error) {
                            console.warn('[Moon Viewer] Could not initialize WorldSamplerUI:', error);
                        }
                    }
                }, 3000);

                Utils.updateLoadingStatus('Configuring Moon scene...', 50);
                
                // Configure scene for Moon
                viewer.scene.globe.enableLighting = true;
                viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#9a9a9a');
                viewer.scene.globe.showGroundAtmosphere = false;
                
                // CRITICAL: Disable ALL water/ocean effects (Moon has no water!)
                viewer.scene.globe.showWaterEffect = false;
                
                // Disable translucency effects that can cause wave-like artifacts
                if (viewer.scene.globe.translucency) {
                    viewer.scene.globe.translucency.enabled = false;
                }
                
                // Configure scene mode transition duration (smoother morphing)
                viewer.scene.morphTime = 1.0; // 1 second transition
                
                // Ensure globe renders properly in all modes
                viewer.scene.globe.depthTestAgainstTerrain = false; // Better for 2D mode
                
                // CRITICAL: Remove atmosphere (no atmosphere on Moon!)
                viewer.scene.skyAtmosphere = undefined;
                viewer.scene.fog.enabled = false;
                viewer.scene.backgroundColor = Cesium.Color.BLACK;
                
                // Disable high dynamic range (HDR) if it causes artifacts
                viewer.scene.highDynamicRange = false;
                
                // Configure lighting to avoid "wet" or reflective appearance
                viewer.scene.light = new Cesium.DirectionalLight({
                    direction: new Cesium.Cartesian3(0.5, 0.5, -0.7) // Sun direction
                });
                
                // Set material appearance to diffuse (not specular/glossy)
                viewer.scene.globe.material = undefined; // Use default non-reflective material
                
                // Use Cesium's built-in starfield skybox
                viewer.scene.skyBox = new Cesium.SkyBox({
                    sources: {
                        positiveX: 'https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Assets/Textures/SkyBox/tycho2t3_80_px.jpg',
                        negativeX: 'https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Assets/Textures/SkyBox/tycho2t3_80_mx.jpg',
                        positiveY: 'https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Assets/Textures/SkyBox/tycho2t3_80_py.jpg',
                        negativeY: 'https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Assets/Textures/SkyBox/tycho2t3_80_my.jpg',
                        positiveZ: 'https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Assets/Textures/SkyBox/tycho2t3_80_pz.jpg',
                        negativeZ: 'https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Assets/Textures/SkyBox/tycho2t3_80_mz.jpg'
                    }
                });
                
                Utils.updateLoadingStatus(`Loading ${PLANET_BODY.name} imagery...`, 60);
                
                // Imagery: the body's sources from planet-bodies.js, first reachable one wins.
                let imageryLoaded = false;
                const reachable = async (url) => {
                    try {
                        const resp = await fetch(url, { signal: AbortSignal.timeout(8000) });
                        return resp.ok;
                    } catch (e) {
                        return false;
                    }
                };
                let baseLayer = null, baseSourceId = null;
                for (const src of PLANET_BODY.imagery) {
                    if (!(await reachable(PlanetBodies.probeUrl(src)))) {
                        console.warn(`✗ ${src.name} unreachable`);
                        continue;
                    }
                    baseLayer = viewer.imageryLayers.addImageryProvider(PlanetBodies.imageryProvider(src, PLANET_ELLIPSOID, Cesium));
                    imageryLoaded = true;
                    baseSourceId = src.id;
                    console.log(`✓ ${PLANET_BODY.name} imagery: ${src.name}`);
                    break;
                }
                if (!imageryLoaded) {
                    Utils.showSnackBar(`${PLANET_BODY.name} imagery services are unreachable; showing a plain globe`, 'warning');
                }

                // View panel "Base Map": this body's sources, then None.
                const baseMapSelect = document.getElementById('baseMapSelect');
                if (baseMapSelect) {
                    const noneOption = baseMapSelect.querySelector('option[value="none"]');
                    PLANET_BODY.imagery.forEach((s) => baseMapSelect.insertBefore(new Option(s.name, s.id), noneOption));
                    baseMapSelect.value = baseSourceId ?? 'none';
                    baseMapSelect.addEventListener('change', () => {
                        if (baseLayer) viewer.imageryLayers.remove(baseLayer);
                        const src = PLANET_BODY.imagery.find((s) => s.id === baseMapSelect.value);
                        baseLayer = src
                            ? viewer.imageryLayers.addImageryProvider(PlanetBodies.imageryProvider(src, PLANET_ELLIPSOID, Cesium), 0)
                            : null;
                    });
                }

                Utils.updateLoadingStatus('Loading Moon terrain...', 70);
                
                // Terrain: the body's quantized-mesh DEM if the registry has one.
                let terrainLoaded = false;
                const terrainSrc = PLANET_BODY.terrain;
                try {
                    if (!terrainSrc) throw new Error(`no global DEM tiles for ${PLANET_BODY.name} yet`);
                    const moonTerrain = await Cesium.CesiumTerrainProvider.fromUrl(
                        terrainSrc.url,
                        { ellipsoid: PLANET_ELLIPSOID, requestVertexNormals: true }
                    );
                    viewer.terrainProvider = moonTerrain;
                    window.DeepGISMoon.moonTerrain = moonTerrain;
                    terrainLoaded = true;
                    console.log(`✓ ${PLANET_BODY.name} terrain: ${terrainSrc.name}`);
                    const terrainSourceEl = document.getElementById('terrainSource');
                    if (terrainSourceEl) {
                        terrainSourceEl.innerHTML = `Terrain: <a href="${terrainSrc.link}" target="_blank" style="color: #10b981;">${terrainSrc.name}</a>`;
                        terrainSourceEl.style.color = '#10b981';
                    }
                } catch (error) {
                    console.warn('✗ Terrain unavailable:', error.message);
                    viewer.terrainProvider = new Cesium.EllipsoidTerrainProvider({
                        ellipsoid: PLANET_ELLIPSOID
                    });
                    const terrainSourceEl = document.getElementById('terrainSource');
                    if (terrainSourceEl) {
                        terrainSourceEl.textContent = terrainSrc
                            ? `Terrain: Smooth ellipsoid (${terrainSrc.name} unavailable)`
                            : 'Terrain: Smooth ellipsoid (no DEM tiles for this body)';
                        terrainSourceEl.style.color = '#f59e0b';
                    }
                }

                // Configure camera constraints for Moon
                // Following LROC QuickMap zoom range for optimal viewing
                viewer.scene.screenSpaceCameraController.minimumZoomDistance = 10.0; // 10 meters - allows close surface inspection
                viewer.scene.screenSpaceCameraController.maximumZoomDistance = 30000000.0; // 30,000 km - better overview capability
                
                // Initial view: the whole disc around the body's home point (Apollo 11 on the Moon).
                // From ~1.7 radii up the limb is ~38 deg below the horizontal; look straight down.
                const home = PlanetBodies.homeView(PLANET_BODY);
                const homeDestination = () =>
                    Cesium.Cartesian3.fromDegrees(home.lon, home.lat, home.heightM, PLANET_ELLIPSOID);
                viewer.camera.setView({
                    destination: homeDestination(),
                    orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0.0 }
                });
                // Cesium's home view is a rectangle over North America; go back to the body's home instead
                viewer.homeButton?.viewModel.command.beforeExecute.addEventListener((e) => {
                    e.cancel = true;
                    viewer.camera.flyTo({
                        destination: homeDestination(),
                        orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0 },
                    });
                });

                // Add Sun as directional light source
                viewer.scene.light = new Cesium.DirectionalLight({
                    direction: new Cesium.Cartesian3(1, 0, 0)
                });
                
                // Enable high dynamic range for better lighting
                viewer.scene.highDynamicRange = true;
                
                if (IS_MOON) {
                    Utils.updateLoadingStatus('Adding Apollo landing sites...', 75);
                    addLandingSites(viewer);
                }

                Utils.updateLoadingStatus('Setting up event handlers...', 85);
                setupEventHandlers(viewer);

                Utils.updateLoadingStatus('Complete!', 100);
                
                setTimeout(() => {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    window.DeepGISMoon.isInitialized = true;
                    
                    // Show success message with loaded data info
                    const statusMsg = [];
                    if (imageryLoaded) statusMsg.push('Imagery');
                    if (terrainLoaded) statusMsg.push('Terrain');
                    if (IS_MOON) statusMsg.push('Landing Sites');
                    
                    Utils.updateStatus(`Ready - ${statusMsg.join(' + ')} Loaded`);
                    Utils.showSnackBar(`${PLANET_BODY.name} viewer ready! ${statusMsg.join(', ')} loaded successfully.`, 'success');
                }, 500);

                // Add error event listener to suppress tile loading errors in UI
                viewer.scene.globe.tileLoadProgressEvent.addEventListener((queuedTileCount) => {
                    if (queuedTileCount === 0) {
                        // All tiles loaded
                        viewer.scene.globe._surface._debug.wireframe = false;
                    }
                });
                
                // Camera move handler for updating UI (altitude display, etc.)
                // Note: Cesium automatically handles tile level-of-detail based on camera distance
                // No manual intervention needed - it gracefully falls back to lower levels when tiles don't exist
                viewer.camera.moveEnd.addEventListener(() => {
                    const cameraHeight = viewer.camera.positionCartographic.height;
                    // Update camera info display (if needed)
                    // Cesium handles optimal tile loading automatically
                    console.debug(`Camera altitude: ${(cameraHeight / 1000).toFixed(2)} km`);
                });
                
                // Suppress imagery provider error events (CORS, 403, etc.)
                viewer.imageryLayers.layerAdded.addEventListener((layer) => {
                    layer.errorEvent.addEventListener((error) => {
                        // Silently handle tile loading errors (CORS, 403, etc.)
                        // These are expected with some public services
                        // LROC tiles may have occasional missing tiles at high zoom levels
                        console.debug('Imagery tile error (handled gracefully):', error);
                    });
                });
                
                // Also suppress errors for existing layers
                if (viewer.imageryLayers.length > 0) {
                    for (let i = 0; i < viewer.imageryLayers.length; i++) {
                        const layer = viewer.imageryLayers.get(i);
                        layer.errorEvent.addEventListener((error) => {
                            // LROC QuickMap may have some missing tiles at very high zoom levels
                            // This is normal and handled gracefully
                            console.debug('Imagery tile error (handled gracefully):', error);
                        });
                    }
                }

                startPerformanceMonitoring(viewer);

                return viewer;

            } catch (error) {
                console.error('Error initializing Cesium Moon viewer:', error);
                Utils.updateLoadingStatus('Error: ' + error.message, 0);
                Utils.updateStatus('Error');
                Utils.showSnackBar('Failed to initialize Moon viewer', 'error');
            }
        }

        // Add Apollo landing site markers
        function addLandingSites(viewer) {
            Object.entries(CONFIG.APOLLO_SITES).forEach(([id, site]) => {
                const entity = viewer.entities.add({
                    id: id,
                    name: site.name,
                    description: site.description,
                    position: Cesium.Cartesian3.fromDegrees(site.lon, site.lat, 0, PLANET_ELLIPSOID),
                    billboard: {
                        image: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PGNpcmNsZSBjeD0iMjAiIGN5PSIyMCIgcj0iMTUiIGZpbGw9IiNmZmZmZmYiIHN0cm9rZT0iIzMzMzMzMyIgc3Ryb2tlLXdpZHRoPSIyIi8+PHRleHQgeD0iMjAiIHk9IjI1IiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTgiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiMzMzMzMzMiPvCflqA8L3RleHQ+PC9zdmc+',
                        width: 40,
                        height: 40,
                        verticalOrigin: Cesium.VerticalOrigin.BOTTOM
                    },
                    label: {
                        text: site.name,
                        font: '14px sans-serif',
                        fillColor: Cesium.Color.WHITE,
                        outlineColor: Cesium.Color.BLACK,
                        outlineWidth: 2,
                        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                        verticalOrigin: Cesium.VerticalOrigin.TOP,
                        pixelOffset: new Cesium.Cartesian2(0, 10)
                    }
                });
                
                window.DeepGISMoon.landingSiteEntities.push(entity);
            });
        }

        // Event handler setup
        function setupEventHandlers(viewer) {
            // View mode handlers
            const handlers = {
                'view2D': () => {
                    // Use morphTo2D for proper transition to flat 2D map
                    viewer.scene.morphTo2D(1.0); // 1 second animation
                    
                    // After morph completes, show the full Moon from pole to pole
                    setTimeout(() => {
                        // In 2D mode, use setView instead of flyTo for better control
                        viewer.camera.setView({
                            destination: Cesium.Rectangle.fromDegrees(-180, -90, 180, 90),
                            orientation: {
                                heading: 0.0,
                                pitch: -Cesium.Math.PI_OVER_TWO, // Look straight down
                                roll: 0.0
                            }
                        });
                        
                        console.log('2D view: Camera set to full Moon rectangle (-180,-90,180,90)');
                    }, 1100); // After morph completes
                },
                'view3D': () => {
                    // Use morphTo3D for proper transition
                    viewer.scene.morphTo3D(1.0); // 1 second animation
                },
                'viewColumbus': () => {
                    // Use morphToColumbusView for proper transition
                    viewer.scene.morphToColumbusView(1.0); // 1 second animation
                },
                'homeView': () => {
                    const home = PlanetBodies.homeView(PLANET_BODY);
                    viewer.camera.flyTo({
                        destination: Cesium.Cartesian3.fromDegrees(home.lon, home.lat, 5000, PLANET_ELLIPSOID),
                        orientation: {
                            heading: 0,
                            pitch: Cesium.Math.toRadians(-45),
                            roll: 0.0
                        },
                        duration: 2
                    });
                }
            };

            // Register view handlers
            Object.entries(handlers).forEach(([id, action]) => {
                document.getElementById(id)?.addEventListener('click', 
                    Utils.createButtonHandler(action, `${id} activated`));
            });

            // Apollo site navigation handlers
            Object.entries(CONFIG.APOLLO_SITES).forEach(([id, site]) => {
                document.getElementById(id)?.addEventListener('click', () => {
                    viewer.camera.flyTo({
                        destination: Cesium.Cartesian3.fromDegrees(
                            site.lon, 
                            site.lat, 
                            3000, // Good altitude for viewing landing site details
                            PLANET_ELLIPSOID
                        ),
                        orientation: {
                            heading: 0,
                            pitch: Cesium.Math.toRadians(-30), // Better viewing angle
                            roll: 0.0
                        },
                        duration: 3
                    });
                    Utils.updateStatus(`Flying to ${site.name}`);
                    Utils.showSnackBar(`Navigating to ${site.name}`, 'info');
                });
            });

            // Measurement handlers
            document.getElementById('measureDistance')?.addEventListener('click', () => {
                startMeasurement('distance');
            });

            document.getElementById('measureArea')?.addEventListener('click', () => {
                startMeasurement('area');
            });

            document.getElementById('measureHeight')?.addEventListener('click', () => {
                startMeasurement('height');
            });

            document.getElementById('clearMeasurements')?.addEventListener('click', () => {
                clearAllMeasurements();
            });

            // Toggle handlers
            document.getElementById('landingSitesToggle')?.addEventListener('change', (e) => {
                window.DeepGISMoon.landingSiteEntities.forEach(entity => {
                    entity.show = e.target.checked;
                });
            });

            document.getElementById('terrainToggle')?.addEventListener('change', (e) => {
                // Note: Terrain is automatically disabled in 2D mode for performance
                // This toggle controls terrain visibility in 3D/Columbus modes
                const mode = viewer.scene.mode;
                
                if (e.target.checked && window.DeepGISMoon.moonTerrain) {
                    // Only enable terrain in 3D/Columbus modes
                    if (mode !== Cesium.SceneMode.SCENE2D) {
                        viewer.terrainProvider = window.DeepGISMoon.moonTerrain;
                        Utils.showSnackBar('Terrain enabled', 'success');
                        
                        const terrainSourceEl = document.getElementById('terrainSource');
                        if (terrainSourceEl) {
                            terrainSourceEl.innerHTML = 'Terrain: <a href="https://quickmap.lroc.asu.edu" target="_blank" style="color: #10b981;">LOLA DEM (NASA LRO)</a>';
                            terrainSourceEl.style.color = '#10b981'; // Green
                        }
                    } else {
                        Utils.showSnackBar('Terrain disabled in 2D mode', 'info');
                    }
                } else {
                    viewer.terrainProvider = new Cesium.EllipsoidTerrainProvider({
                        ellipsoid: PLANET_ELLIPSOID
                    });
                    Utils.showSnackBar('Terrain disabled', 'info');
                    
                    const terrainSourceEl = document.getElementById('terrainSource');
                    if (terrainSourceEl) {
                        terrainSourceEl.textContent = 'Terrain: Disabled by user';
                        terrainSourceEl.style.color = '#64748b'; // Gray
                    }
                }
            });


            // Scene mode change handler (2D vs 3D optimization)
            // Following LROC QuickMap best practice: disable terrain in 2D mode for performance
            viewer.scene.morphComplete.addEventListener(() => {
                const mode = viewer.scene.mode;
                const terrainToggle = document.getElementById('terrainToggle');
                
                console.log('Morph complete to mode:', mode);
                
                if (mode === Cesium.SceneMode.SCENE2D) {
                    // In 2D mode, terrain adds complexity without benefit
                    // Temporarily disable terrain for better performance
                    viewer.terrainProvider = new Cesium.EllipsoidTerrainProvider({
                        ellipsoid: PLANET_ELLIPSOID
                    });
                    
                    // Ensure globe is properly configured for 2D
                    viewer.scene.globe.show = true;
                    viewer.scene.globe.enableLighting = false; // Disable lighting in 2D for flat appearance
                    
                    console.log('2D mode: Terrain disabled for performance, lighting disabled');
                    
                    // Update UI to reflect terrain state
                    const terrainSourceEl = document.getElementById('terrainSource');
                    if (terrainSourceEl) {
                        terrainSourceEl.textContent = 'Terrain: Disabled in 2D mode';
                        terrainSourceEl.style.color = '#64748b'; // Gray
                    }
                    
                    Utils.showSnackBar('Switched to 2D map view', 'info');
                    
                } else if (mode === Cesium.SceneMode.SCENE3D || mode === Cesium.SceneMode.COLUMBUS_VIEW) {
                    // In 3D/Columbus mode, restore terrain if available and enabled
                    // Re-enable lighting for 3D effect
                    viewer.scene.globe.enableLighting = true;
                    
                    if (terrainToggle && terrainToggle.checked && window.DeepGISMoon.moonTerrain) {
                        viewer.terrainProvider = window.DeepGISMoon.moonTerrain;
                        console.log('3D mode: Terrain re-enabled (LOLA DEM), lighting enabled');
                        
                        const terrainSourceEl = document.getElementById('terrainSource');
                        if (terrainSourceEl) {
                            terrainSourceEl.innerHTML = 'Terrain: <a href="https://quickmap.lroc.asu.edu" target="_blank" style="color: #10b981;">LOLA DEM (NASA LRO)</a>';
                            terrainSourceEl.style.color = '#10b981'; // Green
                        }
                    } else {
                        // Terrain toggle is off or no terrain available
                        viewer.terrainProvider = new Cesium.EllipsoidTerrainProvider({
                            ellipsoid: PLANET_ELLIPSOID
                        });
                        
                        const terrainSourceEl = document.getElementById('terrainSource');
                        if (terrainSourceEl) {
                            if (terrainToggle && !terrainToggle.checked) {
                                terrainSourceEl.textContent = 'Terrain: Disabled by user';
                                terrainSourceEl.style.color = '#64748b'; // Gray
                            } else {
                                terrainSourceEl.textContent = 'Terrain: Smooth ellipsoid (LOLA DEM unavailable)';
                                terrainSourceEl.style.color = '#f59e0b'; // Orange warning
                            }
                        }
                    }
                    
                    const modeText = mode === Cesium.SceneMode.SCENE3D ? '3D' : 'Columbus';
                    Utils.showSnackBar(`Switched to ${modeText} view`, 'info');
                }
            });
        }

        // Measurement functions
        function startMeasurement(type) {
            window.DeepGISMoon.measurementMode = type;
            window.DeepGISMoon.measurementPoints = [];
            Utils.updateStatus(`Click on the Moon to measure ${type}`);
            Utils.showSnackBar(`Click on the Moon surface to measure ${type}`, 'info');
        }

        function clearAllMeasurements() {
            window.DeepGISMoon.measurements.forEach(measurement => {
                if (measurement.entity) {
                    window.DeepGISMoon.viewer.entities.remove(measurement.entity);
                }
            });
            window.DeepGISMoon.measurements = [];
            document.getElementById('measurementsList').innerHTML = '<small class="text-muted">No measurements yet</small>';
            Utils.updateStatus('Measurements cleared');
        }

        // Performance monitoring
        function startPerformanceMonitoring(viewer) {
            let lastTime = performance.now();
            let frameCount = 0;

            function updateMetrics() {
                frameCount++;
                const currentTime = performance.now();
                
                if (currentTime - lastTime >= 1000) {
                    const fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
                    document.getElementById('performanceIndicator').textContent = `FPS: ${fps}`;
                    frameCount = 0;
                    lastTime = currentTime;
                }
                
                requestAnimationFrame(updateMetrics);
            }
            
            requestAnimationFrame(updateMetrics);
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initializeCesium);
    </script>

    {% load static %}

    <script src="{% static 'web/js/planet-flight.js' %}?v=20261021"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function initMoonDrone() {
            const F = window.PlanetFlight;
            const $ = (id) => document.getElementById(id);
            const flyBtn = $('droneFlyBtn'), orbitBtn = $('droneOrbitBtn');
            const takeoffBtn = $('droneTakeoffBtn'), landBtn = $('droneLandBtn');
            const stopBtn = $('stopOrbitBtn'), stopBox = $('stopOrbitContainer');
            const pauseBtn = $('pauseOrbitBtn'), pauseBox = $('pauseOrbitContainer');
            const progressBox = $('orbitProgressContainer'), progressText = $('orbitProgressText');
            if (!F || !flyBtn || !orbitBtn) return;
            const takeoffLabel = takeoffBtn?.innerHTML, landLabel = landBtn?.innerHTML;

            const viewer = () => window.DeepGISMoon.viewer;
            const ellipsoid = () => viewer().scene.globe.ellipsoid;
            const radius = () => window.DeepGISMoon.MOON_RADIUS;
            const num = (id, fallback) => {
                const v = parseFloat($(id)?.value);
                return Number.isFinite(v) ? v : fallback;
            };
            const toDeg = (c) => ({
                lon: Cesium.Math.toDegrees(c.longitude),
                lat: Cesium.Math.toDegrees(c.latitude),
                height: c.height,
            });

            // One motion at a time: { kind, cancel, resolve, paused }. Every
            // motion resolves true when it completes and false when stopped.
            let motion = null;
            // Bumped by stop(), so a motion still sampling terrain when the
            // user stops (or starts another) never starts.
            let generation = 0, preparing = 0;

            async function beforeMoving(promise) {
                const g = ++generation;
                preparing++;
                try {
                    const value = await promise;
                    return g === generation ? { value } : null;
                } finally {
                    preparing--;
                }
            }

            function setActive(kind) {
                flyBtn.classList.toggle('active', kind === 'fly');
                orbitBtn.classList.toggle('active', kind === 'orbit');
                if (takeoffBtn && landBtn) {
                    takeoffBtn.classList.toggle('active', kind === 'takeoff');
                    landBtn.classList.toggle('active', kind === 'land');
                    takeoffBtn.innerHTML = kind === 'takeoff' ? '<i class="fas fa-stop"></i> Stop' : takeoffLabel;
                    landBtn.innerHTML = kind === 'land' ? '<i class="fas fa-stop"></i> Stop' : landLabel;
                    takeoffBtn.disabled = kind === 'land';
                    landBtn.disabled = kind === 'takeoff';
                }
                stopBox.style.display = kind ? 'block' : 'none';
                for (const box of [pauseBox, progressBox]) {
                    if (box) box.style.display = kind === 'orbit' ? 'block' : 'none';
                }
                if (kind !== 'orbit') setPaused(false);
            }

            function setPaused(paused) {
                if (motion) motion.paused = paused;
                if (!pauseBtn) return;
                pauseBtn.innerHTML = paused
                    ? '<i class="fas fa-play"></i> Resume (Space)'
                    : '<i class="fas fa-pause"></i> Pause (Space)';
                pauseBtn.classList.toggle('active', paused);
            }

            function settle(resolve, completed) {
                if (!motion || motion.resolve !== resolve) return;
                motion = null;
                setActive(null);
                resolve(completed);
            }

            function stop() {
                generation++;
                if (!motion) return;
                const m = motion;
                motion = null;
                m.cancel();
                setActive(null);
                m.resolve(false);
            }

            function setPose(p) {
                viewer().camera.setView({
                    destination: Cesium.Cartesian3.fromDegrees(p.lon, p.lat, p.height, ellipsoid()),
                    orientation: {
                        heading: Cesium.Math.toRadians(p.heading),
                        pitch: Cesium.Math.toRadians(p.pitch),
                        roll: 0,
                    },
                });
            }

            // Drive `step(elapsedSeconds)` until it returns true. A tab that is
            // hidden mid-flight stops animation frames, so each frame races a
            // timer; poses come from elapsed time, so a slow tick only skips frames.
            // Paused time does not count.
            function run(kind, step) {
                stop();
                return new Promise((resolve) => {
                    let last = performance.now(), elapsed = 0;
                    let raf = null, timeout = null;
                    const cancel = () => {
                        cancelAnimationFrame(raf);
                        clearTimeout(timeout);
                    };
                    const schedule = () => {
                        const fire = () => {
                            cancel();
                            tick();
                        };
                        raf = requestAnimationFrame(fire);
                        timeout = setTimeout(fire, 100);
                    };
                    motion = { kind, resolve, cancel };
                    setActive(kind);
                    function tick() {
                        if (motion?.resolve !== resolve) return;
                        let done = true;
                        try {
                            const now = performance.now();
                            if (!motion.paused) elapsed += (now - last) / 1000;
                            last = now;
                            done = step(elapsed);
                        } catch (err) {
                            console.error('[MoonDrone]', err);
                        }
                        if (done) settle(resolve, true);
                        else schedule();
                    }
                    schedule();
                });
            }

            function flyToPose(p, durationS) {
                stop();
                return new Promise((resolve) => {
                    const camera = viewer().camera;
                    motion = { kind: 'goto', resolve, cancel: () => camera.cancelFlight() };
                    setActive('goto');
                    camera.flyTo({
                        destination: Cesium.Cartesian3.fromDegrees(p.lon, p.lat, p.height, ellipsoid()),
                        orientation: {
                            heading: Cesium.Math.toRadians(p.heading),
                            pitch: Cesium.Math.toRadians(p.pitch),
                            roll: 0,
                        },
                        duration: durationS,
                        complete: () => settle(resolve, true),
                        cancel: () => settle(resolve, false),
                    });
                });
            }

            async function groundHeight(lon, lat) {
                const carto = Cesium.Cartographic.fromDegrees(lon, lat);
                const terrain = window.DeepGISMoon.moonTerrain;
                if (terrain) {
                    try {
                        const [sampled] = await Promise.race([
                            Cesium.sampleTerrainMostDetailed(terrain, [carto]),
                            new Promise((_, reject) => setTimeout(() => reject(new Error('terrain timeout')), 4000)),
                        ]);
                        if (Number.isFinite(sampled.height)) return sampled.height;
                    } catch (err) {
                        console.warn('[MoonDrone] terrain sample failed:', err.message);
                    }
                }
                return viewer().scene.globe.getHeight(Cesium.Cartographic.fromDegrees(lon, lat)) ?? 0;
            }

            /** Ground point at the centre of the view, else straight below the camera. */
            function viewCenter() {
                const v = viewer();
                const canvas = v.scene.canvas;
                const ray = v.camera.getPickRay(new Cesium.Cartesian2(canvas.clientWidth / 2, canvas.clientHeight / 2));
                const hit = ray && v.scene.globe.pick(ray, v.scene);
                const c = hit ? Cesium.Cartographic.fromCartesian(hit, ellipsoid()) : v.camera.positionCartographic;
                return toDeg(c);
            }

            /** Fly `distM` along the current (or given) heading, ending `aglM` above the ground. */
            async function flyForward({ distM, speedMps, aglM = null, headingDeg = null }) {
                const camera = viewer().camera;
                const start = toDeg(camera.positionCartographic);
                const heading = headingDeg ?? Cesium.Math.toDegrees(camera.heading);
                const pitch = Cesium.Math.toDegrees(camera.pitch);
                const end = F.destination(start, heading, distM, radius());
                let endHeight = start.height;
                if (aglM != null) {
                    const ready = await beforeMoving(groundHeight(end.lon, end.lat));
                    if (!ready) return false;
                    endHeight = ready.value + aglM;
                }
                const plan = F.flyForwardPlan({
                    start, startHeight: start.height, headingDeg: heading, distM, endHeight, speedMps, radius: radius(),
                });
                return run('fly', (s) => {
                    const p = plan.sample(s);
                    setPose({ ...p, pitch });
                    return p.done;
                });
            }

            /** Hover `aglM` above a point, looking down (or at `pitchDeg` from `headingDeg`). */
            async function goTo({ lon, lat }, { aglM = 20000, pitchDeg = -90, headingDeg = 0, durationS = 3 } = {}) {
                const ready = await beforeMoving(groundHeight(lon, lat));
                if (!ready) return false;
                return flyToPose({ lon, lat, height: ready.value + aglM, heading: headingDeg, pitch: pitchDeg }, durationS);
            }

            /**
             * Circle `center` at `radiusM`, `aglM` above its ground (null: at
             * the camera's current height), for `revolutions` (0 = until
             * stopped). `pitchDeg` null keeps the centre in the middle of the
             * view; `yawDeg` turns the camera off the inward heading.
             */
            async function orbitAround(center, {
                radiusM, aglM = null, speedMps, revolutions = 1, pitchDeg = null, yawDeg = 0, clockwise = false,
            }) {
                const R = radius();
                const ready = await beforeMoving(groundHeight(center.lon, center.lat));
                if (!ready) return false;
                const centerHeight = ready.value;
                const camera = toDeg(viewer().camera.positionCartographic);
                const agl = aglM ?? Math.max(10, camera.height - centerHeight);
                const startAngleDeg = F.distance(center, camera, R) < 1 ? 0 : F.bearing(center, camera);
                const pose = (angleDeg) => {
                    const p = F.orbitPose({ center, centerHeight, radiusM, aglM: agl, angleDeg, pitchDeg, radius: R });
                    return { ...p, heading: F.wrap360(p.heading + yawDeg) };
                };
                if (!(await flyToPose(pose(startAngleDeg), 2))) return false;
                const lapS = F.orbitCircumference(radiusM, R) / speedMps;
                const at = (s) => F.orbitAngleAt({ startAngleDeg, speedMps, radiusM, elapsedS: s, clockwise, radius: R });
                let shown = -1;
                return run('orbit', (s) => {
                    const finished = revolutions > 0 && s >= revolutions * lapS;
                    const { angleDeg, revolutions: done } = at(finished ? revolutions * lapS : s);
                    setPose(pose(angleDeg));
                    const hundredth = Math.floor(done * 100);
                    if (!finished && progressText && hundredth !== shown) {
                        shown = hundredth;
                        progressText.textContent = `Revolution: ${done.toFixed(2)} / ` +
                            (revolutions > 0 ? revolutions.toFixed(2) : '∞');
                    }
                    return finished;
                });
            }

            /**
             * Climb (dir 1) or descend (dir -1) straight along the vertical at
             * `speedMps` until stopped, `targetHeight` or 2 m above the ground.
             */
            function vertical(dir, speedMps, targetHeight = null) {
                const kind = dir > 0 ? 'takeoff' : 'land';
                if (motion?.kind === kind) {
                    stop();
                    return Promise.resolve(false);
                }
                const camera = viewer().camera;
                const start = toDeg(camera.positionCartographic);
                const heading = Cesium.Math.toDegrees(camera.heading);
                const pitch = Cesium.Math.toDegrees(camera.pitch);
                const floor = () =>
                    (viewer().scene.globe.getHeight(Cesium.Cartographic.fromDegrees(start.lon, start.lat)) ?? 0) + 2;
                return run(kind, (s) => {
                    let height = start.height + dir * speedMps * s;
                    let done = false;
                    if (targetHeight != null && (dir > 0 ? height >= targetHeight : height <= targetHeight)) {
                        height = targetHeight;
                        done = true;
                    }
                    if (dir < 0 && height <= floor()) {
                        height = floor();
                        done = true;
                    }
                    setPose({ lon: start.lon, lat: start.lat, height, heading, pitch });
                    return done;
                });
            }

            const showDegrees = (inputId, labelId) => {
                const input = $(inputId), label = $(labelId);
                input?.addEventListener('input', () => { if (label) label.textContent = `${input.value}°`; });
            };
            showDegrees('droneOrbitPitch', 'orbitPitchValue');
            showDegrees('droneOrbitYaw', 'orbitYawValue');

            flyBtn.addEventListener('click', () => {
                if (!viewer()) return;
                flyForward({
                    distM: num('droneFlyDistance', 20000),
                    speedMps: num('droneFlySpeed', 3000) / 3.6,
                }).catch((err) => console.error('[MoonDrone] fly failed:', err));
            });

            orbitBtn.addEventListener('click', () => {
                if (!viewer()) return;
                if (motion?.kind === 'orbit') return stop();
                orbitAround(viewCenter(), {
                    radiusM: num('droneOrbitRadius', 20000),
                    speedMps: num('droneHorizontalSpeed', 800),
                    revolutions: num('droneOrbitRevolutions', 1),
                    pitchDeg: num('droneOrbitPitch', -35),
                    yawDeg: num('droneOrbitYaw', 0),
                }).catch((err) => console.error('[MoonDrone] orbit failed:', err));
            });

            takeoffBtn?.addEventListener('click', () => viewer() && vertical(1, num('droneVerticalSpeed', 100)));
            landBtn?.addEventListener('click', () => viewer() && vertical(-1, num('droneVerticalSpeed', 100)));
            pauseBtn?.addEventListener('click', () => motion?.kind === 'orbit' && setPaused(!motion.paused));
            stopBtn?.addEventListener('click', stop);

            // D, O, P and Esc are bound with the other HUD shortcuts below.
            document.addEventListener('keydown', (e) => {
                if (e.target.closest?.('input, textarea, select')) return;
                if (e.key === 'u' || e.key === 'U') takeoffBtn?.click();
                else if (e.key === 'l' || e.key === 'L') landBtn?.click();
                else if (e.key === ' ' && motion?.kind === 'orbit') {
                    e.preventDefault();
                    pauseBtn?.click();
                }
            });

            window.DeepGISMoonDrone = {
                flyForward,
                goTo,
                orbitAround,
                stop,
                isBusy: () => motion !== null || preparing > 0,
                viewCenter,
                groundHeight,
                climbTo: (height) => vertical(1, num('droneVerticalSpeed', 100), height),
                descendTo: (height) => vertical(-1, num('droneVerticalSpeed', 100), height),
            };
        });
    </script>
    <script>
        // HUD Panel Management
        (function() {
            let activePanel = null;
            
            function closeHudPanel(panelId) {
                const panel = document.getElementById(panelId);
                if (panel) {
                    panel.classList.remove('visible');
                    const btn = document.querySelector(`[data-panel="${panelId}"]`);
                    if (btn) btn.classList.remove('active');
                    if (activePanel === panelId) activePanel = null;
                }
            }
            window.closeHudPanel = closeHudPanel; // Make globally accessible
            
            function toggleHudPanel(panelId) {
                const panel = document.getElementById(panelId);
                const btn = document.querySelector(`[data-panel="${panelId}"]`);
                
                // Close any open panel
                if (activePanel && activePanel !== panelId) {
                    closeHudPanel(activePanel);
                }
                
                if (panel.classList.contains('visible')) {
                    panel.classList.remove('visible');
                    if (btn) btn.classList.remove('active');
                    activePanel = null;
                } else {
                    panel.classList.add('visible');
                    if (btn) btn.classList.add('active');
                    activePanel = panelId;
                }
            }
            
            function initHUD() {
                // Setup toolbar button clicks
                document.querySelectorAll('.hud-btn[data-panel]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const panelId = btn.getAttribute('data-panel');
                        toggleHudPanel(panelId);
                    });
                });
                
                // Quick view buttons
                document.getElementById('quickView2D')?.addEventListener('click', () => {
                    document.getElementById('view2D')?.click();
                });
                document.getElementById('quickView3D')?.addEventListener('click', () => {
                    document.getElementById('view3D')?.click();
                });
                document.getElementById('quickHome')?.addEventListener('click', () => {
                    document.getElementById('homeView')?.click();
                });
                
                // Close panel when clicking outside
                document.addEventListener('click', (e) => {
                    if (activePanel) {
                        const panel = document.getElementById(activePanel);
                        const toolbar = document.getElementById('hudToolbar');
                        if (panel && !panel.contains(e.target) && !toolbar.contains(e.target)) {
                            closeHudPanel(activePanel);
                        }
                    }
                    
                    // Close keyboard shortcuts legend when clicking outside
                    const legend = document.getElementById('keyboardShortcutsLegend');
                    if (legend && legend.classList.contains('visible') && !legend.contains(e.target)) {
                        legend.classList.remove('visible');
                    }
                });
                
                // Keyboard shortcuts handler
                document.addEventListener('keydown', (e) => {
                    // Ignore if typing in input fields
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
                        return;
                    }
                    
                    // H key: Toggle keyboard shortcuts legend
                    if (e.key === 'h' || e.key === 'H') {
                        e.preventDefault();
                        const legend = document.getElementById('keyboardShortcutsLegend');
                        if (legend) {
                            legend.classList.toggle('visible');
                        }
                        return;
                    }
                    
                    // V key: Toggle view mode (2D/3D)
                    if (e.key === 'v' || e.key === 'V') {
                        e.preventDefault();
                        const viewer = window.DeepGISMoon?.viewer || window.viewer;
                        if (viewer) {
                            const currentMode = viewer.scene.mode;
                            if (currentMode === Cesium.SceneMode.SCENE3D) {
                                // Switch to 2D
                                const btn2D = document.getElementById('view2D');
                                if (btn2D) btn2D.click();
                            } else {
                                // Switch to 3D
                                const btn3D = document.getElementById('view3D');
                                if (btn3D) btn3D.click();
                            }
                        }
                        return;
                    }
                    
                    // Arrow keys: Perspective views
                    if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        const btnNorth = document.getElementById('viewNorth');
                        if (btnNorth) btnNorth.click();
                        return;
                    }
                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        const btnSouth = document.getElementById('viewSouth');
                        if (btnSouth) btnSouth.click();
                        return;
                    }
                    if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        const btnWest = document.getElementById('viewWest');
                        if (btnWest) btnWest.click();
                        return;
                    }
                    if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        const btnEast = document.getElementById('viewEast');
                        if (btnEast) btnEast.click();
                        return;

                // Model loading functions
                async function loadModelAtLocation(viewer) {
                    const modelUrl = document.getElementById('modelUrl')?.value?.trim();
                    if (!modelUrl) {
                        alert('Please enter a model URL or Ion Asset ID');
                        return;
                    }
                    
                    const locationOption = document.getElementById('modelLocation')?.value || 'current_view';
                    const scale = parseFloat(document.getElementById('modelScale')?.value || '1.0');
                    
                    try {
                        let modelPosition;
                        let shouldZoomToLocation = false;
                        
                        // Get Apollo landing site coordinates
                        const apolloSites = {
                            apollo11: { lon: 23.47297, lat: 0.67408 },
                            apollo12: { lon: -23.42157, lat: -3.01239 },
                            apollo14: { lon: -17.47139, lat: -3.64544 },
                            apollo15: { lon: 3.62981, lat: 26.13224 },
                            apollo16: { lon: 15.50019, lat: -8.97301 },
                            apollo17: { lon: 30.77168, lat: 20.19080 }
                        };
                        
                        switch (locationOption) {
                            case 'custom':
                                const customLon = parseFloat(document.getElementById('customLon')?.value);
                                const customLat = parseFloat(document.getElementById('customLat')?.value);
                                const customAlt = parseFloat(document.getElementById('customAlt')?.value || '0');
                                
                                if (isNaN(customLon) || isNaN(customLat)) {
                                    alert('Please enter valid custom coordinates');
                                    return;
                                }
                                
                                modelPosition = Cesium.Cartesian3.fromDegrees(
                                    customLon, customLat, customAlt, PLANET_ELLIPSOID
                                );
                                shouldZoomToLocation = true;
                                break;
                            
                            case 'apollo11':
                            case 'apollo12':
                            case 'apollo14':
                            case 'apollo15':
                            case 'apollo16':
                            case 'apollo17':
                                const site = apolloSites[locationOption];
                                modelPosition = Cesium.Cartesian3.fromDegrees(
                                    site.lon, site.lat, 0, PLANET_ELLIPSOID
                                );
                                shouldZoomToLocation = true;
                                break;
                            
                            case 'current_view':
                            default:
                                const cameraPosition = viewer.camera.positionCartographic;
                                modelPosition = Cesium.Cartesian3.fromRadians(
                                    cameraPosition.longitude,
                                    cameraPosition.latitude,
                                    0,
                                    PLANET_ELLIPSOID
                                );
                                break;
                        }
                        
                        // Check if it's an Ion Asset ID
                        if (/^\d+$/.test(modelUrl)) {
                            const ionAssetId = parseInt(modelUrl);
                            const tileset = await Cesium.Cesium3DTileset.fromIonAssetId(ionAssetId);
                            
                            const transform = Cesium.Transforms.eastNorthUpToFixedFrame(modelPosition);
                            const scaleMatrix = Cesium.Matrix4.fromUniformScale(scale);
                            tileset.modelMatrix = Cesium.Matrix4.multiply(transform, scaleMatrix, new Cesium.Matrix4());
                            
                            viewer.scene.primitives.add(tileset);
                            
                            if (shouldZoomToLocation) {
                                viewer.camera.flyTo({
                                    destination: modelPosition,
                                    orientation: {
                                        heading: Cesium.Math.toRadians(0),
                                        pitch: Cesium.Math.toRadians(-45),
                                        roll: 0.0
                                    },
                                    duration: 2.0
                                });
                            } else {
                                viewer.zoomTo(tileset);
                            }
                            
                            console.log(`3D Tileset ${ionAssetId} loaded successfully`);
                        } else {
                            // Load as regular GLTF/GLB model
                            const entity = viewer.entities.add({
                                name: 'Lunar Model',
                                position: modelPosition,
                                model: {
                                    uri: modelUrl,
                                    scale: scale,
                                    minimumPixelSize: 64,
                                    maximumScale: 10000,
                                    runAnimations: true,
                                    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                                    silhouetteColor: Cesium.Color.YELLOW,
                                    silhouetteSize: 2.0,
                                    show: true
                                }
                            });
                            
                            await entity.model.readyPromise;
                            
                            if (shouldZoomToLocation) {
                                viewer.camera.flyTo({
                                    destination: modelPosition,
                                    orientation: {
                                        heading: Cesium.Math.toRadians(0),
                                        pitch: Cesium.Math.toRadians(-45),
                                        roll: 0.0
                                    },
                                    duration: 2.0
                                });
                            } else {
                                viewer.zoomTo(entity, new Cesium.HeadingPitchRange(0, 0, 200));
                            }
                            
                            console.log('3D model loaded successfully');
                        }
                    } catch (error) {
                        console.error('Error loading model:', error);
                        alert(`Failed to load model: ${error.message}`);
                    }
                }
                
                async function quickLoadModelAtCurrentLocation(viewer) {
                    const modelUrl = document.getElementById('modelUrl')?.value?.trim();
                    if (!modelUrl) {
                        alert('Please enter a model URL or Ion Asset ID');
                        return;
                    }
                    
                    try {
                        const cameraPosition = viewer.camera.positionCartographic;
                        const modelPosition = Cesium.Cartesian3.fromRadians(
                            cameraPosition.longitude,
                            cameraPosition.latitude,
                            0,
                            PLANET_ELLIPSOID
                        );
                        
                        // Check if it's an Ion Asset ID
                        if (/^\d+$/.test(modelUrl)) {
                            const ionAssetId = parseInt(modelUrl);
                            const tileset = await Cesium.Cesium3DTileset.fromIonAssetId(ionAssetId);
                            
                            const transform = Cesium.Transforms.eastNorthUpToFixedFrame(modelPosition);
                            tileset.modelMatrix = transform;
                            
                            viewer.scene.primitives.add(tileset);
                            viewer.zoomTo(tileset);
                        } else {
                            const entity = viewer.entities.add({
                                name: 'Lunar Model',
                                position: modelPosition,
                                model: {
                                    uri: modelUrl,
                                    scale: 1.0,
                                    minimumPixelSize: 64,
                                    maximumScale: 10000,
                                    runAnimations: true,
                                    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                                    show: true
                                }
                            });
                            
                            await entity.model.readyPromise;
                            viewer.zoomTo(entity, new Cesium.HeadingPitchRange(0, 0, 200));
                        }
                        
                        console.log('Model quick-loaded at current location');
                    } catch (error) {
                        console.error('Error quick-loading model:', error);
                        alert(`Failed to load model: ${error.message}`);
                    }
                }
                
                function removeAllModels(viewer) {
                    // Remove all entities with models
                    const entitiesToRemove = [];
                    viewer.entities.values.forEach(entity => {
                        if (entity.model) {
                            entitiesToRemove.push(entity);
                        }
                    });
                    entitiesToRemove.forEach(entity => {
                        viewer.entities.remove(entity);
                    });
                    
                    // Remove all 3D tilesets
                    const primitivesToRemove = [];
                    for (let i = viewer.scene.primitives.length - 1; i >= 0; i--) {
                        const primitive = viewer.scene.primitives.get(i);
                        if (primitive instanceof Cesium.Cesium3DTileset) {
                            primitivesToRemove.push(primitive);
                        }
                    }
                    primitivesToRemove.forEach(primitive => {
                        viewer.scene.primitives.remove(primitive);
                    });
                    
                    console.log('All models removed');
                }
                
                // Setup model loading after viewer is ready
                setTimeout(setupModelLoading, 2000);
                setTimeout(setupModelLoading, 5000);
                
                console.log('[HUD] Initialized - Press H to show keyboard shortcuts');
            }
            
            // Initialize when DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => {
                    initHUD();
                });
            } else {
                initHUD();
            }
        })();
    </script>
    
    {% include "web/hud/hud.html" with hud_body=planet_body|default:"moon" %}
    <script src="{% static 'web/js/widgets/altimeter.js' %}?v=20261021"></script>
    <script type="module">
        import { initializeNavigation } from "{% static 'web/js/widgets/navigation.js' %}?v=20261021";
        // Camera Pose, heading dial and attitude indicator, as on the Earth viewer
        const startNavigation = () => (window.viewer ? initializeNavigation(window.viewer) : setTimeout(startNavigation, 300));
        startNavigation();
    </script>
</body>
