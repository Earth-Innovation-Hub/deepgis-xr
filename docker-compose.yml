version: '3.9'

services:
  web:
    build:
      context: .
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - DJANGO_SETTINGS_MODULE=deepgis_xr.settings
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - VECTOR_TILES_URL=${VECTOR_TILES_URL:-https://vector_tiles:8080}
      - RASTER_TILES_URL=${RASTER_TILES_URL:-https://raster_tiles:8081}
      # Remote AI Services
      - GROUNDING_DINO_API_URL=${GROUNDING_DINO_API_URL:-http://192.168.0.232:5000}
      - GROUNDED_SAM_API_URL=${GROUNDED_SAM_API_URL:-http://192.168.0.232:5001}
      - MASKRCNN_ROCKS_API_URL=${MASKRCNN_ROCKS_API_URL:-http://192.168.0.232:5002}
      - MASKRCNN_HOUSE_API_URL=${MASKRCNN_HOUSE_API_URL:-http://192.168.0.232:5003}
      - MASKRCNN_HYPOLITH_API_URL=${MASKRCNN_HYPOLITH_API_URL:-http://192.168.0.232:5004}
      - MASKRCNN_LITTER_API_URL=${MASKRCNN_LITTER_API_URL:-http://192.168.0.232:5005}
      - MASKRCNN_ROADKILL_API_URL=${MASKRCNN_ROADKILL_API_URL:-http://192.168.0.232:5006}
      - MASKRCNN_NEWLIFE_API_URL=${MASKRCNN_NEWLIFE_API_URL:-http://192.168.0.232:5007}
      - MASKRCNN_BRENT_MOON_CRATERS_API_URL=${MASKRCNN_BRENT_MOON_CRATERS_API_URL:-http://192.168.0.232:5008}
      - MASKRCNN_HARISH_MOON_CRATERS_API_URL=${MASKRCNN_HARISH_MOON_CRATERS_API_URL:-http://192.168.0.232:5009}
      # GPU support
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - .:/app
      - media_volume:/app/media
      # Mount dreams_laboratory/scripts for SAM and ML scripts
      - ../dreams_laboratory/scripts:/app/dreams_laboratory_scripts:ro
      # Mount deepgis_results for SAM analysis results (shared with host)
      - ./deepgis_results:/app/deepgis_results
      # Named volume for YOLO models (auto-downloaded on first use)
      - yolo_models_volume:/app/models
      # Mount dreamslab-store for accessing training data
      - /mnt/dreamslab-store:/mnt/dreamslab-store:ro
      # Overlay the in-development kernelcal.distinction_game subpackage
      # onto the wheel-installed kernelcal in the image. PyPI/git wheel of
      # kernelcal lags behind the local source where distinction_game lives;
      # this read-only bind keeps the container's import path in sync with
      # /home/jdas/kernelcal without requiring a docker rebuild on every
      # kernelcal commit. Remove this line once kernelcal>=0.10 (with
      # distinction_game) is published and pinned in requirements.txt.
      - /home/jdas/kernelcal/kernelcal/distinction_game:/opt/venv/lib/python3.9/site-packages/kernelcal/distinction_game:ro
      # Same overlay for kernelcal.urban — needed by the urban-spectral
      # analyzer's road-aware k-NN path (buildings_to_graph_via_roads*)
      # and by the SceneGraph orchestrator's Option-A merge
      # (use_city_graph_regions=True). The published kernelcal wheel
      # only carries Euclidean buildings_to_graph_from_bbox, so without
      # this mount the road_knn pipeline 503's cleanly but never runs.
      - /home/jdas/kernelcal/kernelcal/urban:/opt/venv/lib/python3.9/site-packages/kernelcal/urban:ro
    ports:
      - "8060:8090"
    # Enable GPU access
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      bash -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8090
      "

  tileserver:
    image: maptiler/tileserver-gl
    ports:
      - "8091:80"
    volumes:
      - ./data:/data
    environment:
      - CORS_ENABLED=true
      - TILESERVER_GL_DATA_PATH=/data
    command: ["-p", "80", "--verbose"]

volumes:
  media_volume:
  yolo_models_volume:
