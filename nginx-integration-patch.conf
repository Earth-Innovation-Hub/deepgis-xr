# Nginx Integration Patch for Large GLB Model Support
# Add these configurations to your existing /etc/nginx/nginx.conf

# 1. ADD TO THE HTTP BLOCK (after existing mime.types include):

# Enhanced MIME types for 3D models
types {
    model/gltf-binary                     glb;
    model/gltf+json                       gltf;
    application/octet-stream              bin buffer;
    model/obj                             obj;
    model/mtl                             mtl;
    application/json                      json;
}

# Large file handling
client_max_body_size 200M;
client_body_buffer_size 128k;
client_body_timeout 300s;
client_header_timeout 300s;
send_timeout 300s;

# Enhanced gzip compression for 3D models
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types
    application/octet-stream
    model/gltf-binary
    model/gltf+json
    application/json
    text/plain
    text/css
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript;

# Proxy settings for large files
proxy_buffering on;
proxy_buffer_size 8k;
proxy_buffers 16 8k;
proxy_busy_buffers_size 16k;
proxy_max_temp_file_size 2048m;
proxy_temp_file_write_size 8k;
proxy_connect_timeout 300s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;

# 2. MODIFY YOUR EXISTING deepgis.org SERVER BLOCK:
# Add this location block to your existing server block for deepgis.org

location /static/deepgis/models/ {
    alias /home/jdas/dreams-lab-website-server/deepgis-xr/staticfiles/deepgis/models/;
    
    # Extended cache for 3D models
    expires 7d;
    add_header Cache-Control "public, no-transform, immutable";
    
    # CORS headers for 3D models
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Accept, Accept-Encoding, Accept-Language" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
    
    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Accept, Accept-Encoding, Accept-Language" always;
        add_header Access-Control-Max-Age 86400;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Content-Length 0;
        return 204;
    }
    
    # Enable range requests for large files
    add_header Accept-Ranges bytes always;
    
    # Optimize for large file delivery
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Set appropriate MIME type for GLB files
    location ~* \.glb$ {
        add_header Content-Type "model/gltf-binary" always;
        add_header Content-Disposition "inline" always;
    }
    
    location ~* \.gltf$ {
        add_header Content-Type "model/gltf+json" always;
    }
}

# 3. ADD NEW SERVER BLOCK FOR 3D MODELS SUBDOMAIN (optional but recommended):

server {
    listen 80;
    server_name models.deepgis.org;
    return 301 https://$server_name$request_uri;
}

server {
    server_name models.deepgis.org;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/deepgis.org-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deepgis.org-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/dhparams.pem;

    # Root directory for 3D models
    root /home/jdas/dreams-lab-website-server/deepgis-xr/staticfiles/deepgis/models/;
    
    # Default index files
    index index.html index.json;
    
    # Main location for 3D models
    location / {
        try_files $uri $uri/ =404;
        
        # Extended cache for 3D models
        expires 7d;
        add_header Cache-Control "public, no-transform, immutable";
        
        # CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Accept, Accept-Encoding, Accept-Language" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Accept, Accept-Encoding, Accept-Language" always;
            add_header Access-Control-Max-Age 86400;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
        
        # Enable range requests
        add_header Accept-Ranges bytes always;
        
        # Optimize delivery
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }
    
    # Specific handling for GLB files
    location ~* \.glb$ {
        add_header Content-Type "model/gltf-binary" always;
        add_header Content-Disposition "inline" always;
        
        # Progressive loading headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    
    # Specific handling for GLTF files
    location ~* \.gltf$ {
        add_header Content-Type "model/gltf+json" always;
    }
    
    # Model metadata and manifests
    location ~* \.(json|xml)$ {
        add_header Content-Type "application/json" always;
        expires 1h;
    }
    
    # Compressed variants
    location ~* \.(gz|br)$ {
        add_header Content-Encoding gzip;
        add_header Vary "Accept-Encoding";
    }
} 