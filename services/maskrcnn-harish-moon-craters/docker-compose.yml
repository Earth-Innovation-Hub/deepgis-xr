version: "3.8"

# maskrcnn-harish-moon-craters — sibling of services/maskrcnn-rocks
# pinned to Harish Anand's lunar LROC-NAC crater Mask R-CNN run.
#
# Default checkpoint: `hanand_stragglers_download.openuas.us_e0099`
#   * /mnt/22tb-hdd/maskrcnn/space/hanand_stragglers/download.openuas.us__epoch_0099.param
#   * Promoted "best" from the 100-epoch crater detection sweep
#     (Sep–Nov 2020), recovered from openuas.us alongside Harish
#     Anand's DeepGIS notebook work.
#   * The lighter ResNet-18-FPN sibling
#     `hanand_stragglers_hanand_home___r18fpn_e0008` (78 MB, 8 epochs)
#     is also reachable by model_id for edge / low-VRAM evaluation
#     without restart — the loader auto-detects the backbone from
#     conv1 shape.

services:
  maskrcnn-harish-moon-craters:
    build:
      context: ../maskrcnn-rocks
      dockerfile: Dockerfile
    image: maskrcnn-rocks:latest
    container_name: maskrcnn-harish-moon-craters-api

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ports:
      - "5009:5000"

    volumes:
      - /mnt/22tb-hdd/maskrcnn:/opt/program/weights:ro
      - ./uploads:/tmp/uploads
      - ./results:/tmp/results

    environment:
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - DEFAULT_MODEL_ID=hanand_stragglers_download.openuas.us_e0099
      - MASKRCNN_LABELS_HANAND_STRAGGLERS=background,crater
      - DEFAULT_LABEL_NAME=crater
      - WEIGHTS_ROOT=/opt/program/weights
      - MAX_CONTENT_LENGTH=33554432

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - "com.dreams-lab.service=maskrcnn-harish-moon-craters"
      - "com.dreams-lab.port=5009"
      - "com.dreams-lab.body=moon"
      - "com.dreams-lab.author=harish"
      - "com.dreams-lab.peers=groundingdino-api:5000,groundedsam2-api:5001,maskrcnn-rocks-api:5002,maskrcnn-house-api:5003,maskrcnn-hypolith-api:5004,maskrcnn-litter-api:5005,maskrcnn-roadkill-api:5006,maskrcnn-newlife-api:5007,maskrcnn-brent-moon-craters-api:5008"
