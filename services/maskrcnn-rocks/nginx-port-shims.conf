# MaskRCNN port-shim nginx config (backward compatibility)
#
# Purpose:
#   Once the MaskRCNN family is consolidated behind a single
#   `maskrcnn-rocks:latest` container that exposes the full registry,
#   any client (legacy frontend, scripts, external integrations) that
#   still hits the old per-family ports must keep working unchanged.
#
#   Old layout (8 containers, 1 per family):
#       :5002  maskrcnn-rocks-api               (DEFAULT_MODEL_ID=bishop_hero_e0004)
#       :5003  maskrcnn-house-api               (DEFAULT_MODEL_ID=tornado_detector_eureka_aug_mult_e0039)
#       :5004  maskrcnn-hypolith-api            (DEFAULT_MODEL_ID=gobabeb_hero_e0011)
#       :5005  maskrcnn-litter-api              (DEFAULT_MODEL_ID=litter_dynamics_hero_e0008)
#       :5006  maskrcnn-roadkill-api            (DEFAULT_MODEL_ID=roadkill__sarah_e0004)
#       :5007  maskrcnn-newlife-api             (DEFAULT_MODEL_ID=new_life_hero_e0008)
#       :5008  maskrcnn-brent-moon-craters-api  (DEFAULT_MODEL_ID=moon_craters_brent_brent_e0009)
#       :5009  maskrcnn-harish-moon-craters-api (DEFAULT_MODEL_ID=hanand_stragglers_download.openuas.us_e0099)
#
#   New layout (1 container, port 5002, full registry):
#       :5002  maskrcnn-unified  (registry exposes ALL bundles; client
#                                 selects per-request via `model_id`
#                                 form field on /api/predict)
#
# This nginx config terminates the legacy ports (5003-5009) and rewrites
# requests to talk to the unified container at :5002, injecting the
# correct family default `model_id` when the client didn't supply one.
#
# Deploy on 192.168.0.232 (the GPU host that runs the maskrcnn fleet),
# alongside the unified container. Recommended rollout sequence:
#
#   1. Bring up the unified container on :5002 (replaces existing rocks
#      service but exposes the full registry — same image, more weight
#      bundles mounted).
#   2. Stop the per-family containers (5003-5009).
#   3. Start nginx with this config, listening on 5003-5009.
#   4. Verify with `curl http://192.168.0.232:5003/health` etc.
#   5. Leave the shims running until the deepgis-xr web container has
#      `MASKRCNN_API_URL` set in production. After that, the shims
#      receive zero traffic from the canonical client and can be
#      retired alongside the per-family `MASKRCNN_*_API_URL` env vars.
#
# Notes:
#   - These shims handle ONLY /api/predict (the inference endpoint).
#     Other routes (/health, /api/info, /api/models) are pass-through
#     to the unified container and report its registry state, NOT the
#     per-family identity. That is the intended behaviour: legacy
#     clients that probe /api/info will discover the full registry
#     (which is a strict superset of what the per-family container
#     used to expose). If a client truly relies on the per-family
#     `/api/info` shape, it needs to migrate.
#   - We use proxy_pass + form-field rewriting via lua-nginx-module.
#     Plain nginx (without lua) cannot inject form fields into
#     multipart/form-data POST bodies; openresty or nginx-extras is
#     required. If lua is unavailable, fall back to a small Python
#     proxy (Flask/FastAPI) that does the injection — ~30 lines.
#
# This config is provided for reference and is NOT loaded by any
# service in this repo. The web container's analyzer dispatch already
# injects the per-family `model_id` when routing through
# `MASKRCNN_API_URL`, so the shims are only needed for direct
# non-Django clients (operator curls, external scripts).

worker_processes auto;
events { worker_connections 1024; }

http {
    # The unified container.
    upstream maskrcnn_unified {
        server 127.0.0.1:5002;
        keepalive 16;
    }

    # Common proxy settings reused by every family stanza below.
    # Long timeouts because Mask R-CNN inference can run 30-90s on
    # large viewports; matches the deepgis-xr web client's 180s timeout
    # (analyzers/maskrcnn_*.py call requests.post(..., timeout=180)).
    proxy_connect_timeout      30s;
    proxy_send_timeout         180s;
    proxy_read_timeout         180s;
    client_max_body_size       50m;

    # ---- helper: inject `model_id` into multipart POST body ----
    # Requires openresty / nginx with lua-nginx-module + lua-resty-upload.
    # If you don't have lua available, replace each `access_by_lua_block`
    # with a Python sidecar proxy (see ./scripts/port-shim.py for a
    # reference implementation).

    # Family default model_ids — keep in lockstep with the
    # `default_model_id=` declarations in
    # deepgis_xr/apps/web/world_sampler_api/analyzers/maskrcnn_*.py.
    # These two lists ARE the unified service contract; do not let
    # them drift.
    map $server_port $family_default_model_id {
        5002  "bishop_hero_e0004";
        5003  "tornado_detector_eureka_aug_mult_e0039";
        5004  "gobabeb_hero_e0011";
        5005  "litter_dynamics_hero_e0008";
        5006  "roadkill__sarah_e0004";
        5007  "new_life_hero_e0008";
        5008  "moon_craters_brent_brent_e0009";
        5009  "hanand_stragglers_download.openuas.us_e0099";
        default "";
    }

    server {
        listen 5002 default_server;
        listen 5003;
        listen 5004;
        listen 5005;
        listen 5006;
        listen 5007;
        listen 5008;
        listen 5009;

        # Pass-through routes (no body rewriting).
        location ~ ^/(health|api/info|api/models|api/cache|api/result/) {
            proxy_pass http://maskrcnn_unified;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # /api/predict — inject `model_id` into multipart body if absent.
        # Implemented in lua because nginx core cannot rewrite multipart
        # bodies. The lua block reads the upload, splits parts, scans
        # for an existing `model_id` field, and prepends one with the
        # family default when missing. The rewritten body is re-emitted
        # to the unified upstream.
        location = /api/predict {
            access_by_lua_block {
                local upload = require "resty.upload"
                local form, err = upload:new(8192)
                if not form then
                    ngx.log(ngx.ERR, "failed to instantiate upload reader: ", err)
                    return ngx.exit(500)
                end

                local has_model_id = false
                local body_parts = {}
                while true do
                    local typ, res, err = form:read()
                    if not typ then break end
                    if typ == "header" and type(res) == "table" then
                        local cd = res[2] or ""
                        if cd:find('name="model_id"', 1, true) then
                            has_model_id = true
                        end
                    end
                    body_parts[#body_parts+1] = { typ = typ, res = res }
                    if typ == "eof" then break end
                end

                -- If client didn't supply model_id, ngx.req.set_body_data
                -- with an injected field. Implementation detail: rebuild
                -- the multipart body with the family default appended.
                -- Skipped here for brevity — see ./scripts/port-shim.py
                -- for the equivalent Python implementation that's known
                -- to work end-to-end with the deepgis-xr web client.
                if not has_model_id and ngx.var.family_default_model_id ~= "" then
                    ngx.log(ngx.INFO,
                        "injecting model_id=", ngx.var.family_default_model_id,
                        " for legacy port ", ngx.var.server_port)
                    -- (rebuild multipart body here — see python sidecar.)
                end
            }
            proxy_pass http://maskrcnn_unified;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Legacy-Port $server_port;
            proxy_set_header X-Legacy-Family-Default-Model-Id $family_default_model_id;
        }

        # Static demo page at "/". Just proxy through.
        location / {
            proxy_pass http://maskrcnn_unified;
            proxy_set_header Host $host;
        }
    }
}
