# Nginx configuration for large 3D model optimization
# Add this to your main nginx.conf or include it as a separate file

# MIME types for 3D models
http {
    include /etc/nginx/mime.types;
    
    # Add 3D model MIME types
    types {
        model/gltf-binary glb;
        model/gltf+json gltf;
        application/octet-stream bin buffer;
    }
    
    # Enable compression for large files
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/octet-stream
        model/gltf-binary
        model/gltf+json
        application/json;
    
    # Increase buffer sizes for large files
    client_max_body_size 200M;
    client_body_buffer_size 128k;
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    
    server {
        listen 80;
        listen 443 ssl http2;
        
        # Large 3D model files optimization
        location ~* \.(glb|gltf)$ {
            # Enable byte-range requests for progressive loading
            add_header Accept-Ranges bytes;
            
            # Long-term caching for models
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            
            # CORS headers for cross-origin requests
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range, Content-Range";
            
            # Enable gzip compression
            gzip_static on;
            
            # Handle OPTIONS requests for CORS
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
                add_header Access-Control-Allow-Headers "Range, Content-Range";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }
        
        # Binary data files (textures, buffers)
        location ~* \.(bin|buffer)$ {
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Accept-Ranges bytes;
            add_header Access-Control-Allow-Origin "*";
            gzip_static on;
        }
        
        # Preload critical 3D models
        location ~* /label_topology {
            add_header Link "</static/deepgis/models/gltf/navagunjara-reborn-digital-twin-propane-and-solar-v4.glb>; rel=preload; as=fetch; crossorigin";
        }
    }
} 